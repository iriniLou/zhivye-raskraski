const Sound = {
  ctx: null, out: null, muted: false, buffers: {}, loading: null,
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      // компрессор выравнивает громкость, когда голосов несколько
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 3;
      this.out = this.ctx.createGain(); this.out.gain.value = 0.9;
      this.out.connect(comp).connect(this.ctx.destination);
      this.loading = this.decodeAll();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  ready() { return !this.muted && this.unlock(); },

  // base64 → байты → AudioBuffer (обе формы decodeAudioData — для старого Safari)
  async decodeAll() {
    for (const [name, url] of Object.entries(SOUND_DATA)) {
      try {
        const b64 = url.slice(url.indexOf(',') + 1), bin = atob(b64), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        this.buffers[name] = await new Promise((res, rej) => {
          const p = this.ctx.decodeAudioData(bytes.buffer, res, rej);
          if (p && p.then) p.then(res, rej);
        });
      } catch (e) { console.warn('Не удалось декодировать звук', name, e); }
    }
  },

  play(name, rate = 1, vol = 1) {
    const ac = this.ready(); if (!ac) return;
    const go = () => {
      const buf = this.buffers[name]; if (!buf) return;
      const src = ac.createBufferSource(), g = ac.createGain();
      src.buffer = buf; src.playbackRate.value = rate; g.gain.value = vol;
      src.connect(g).connect(this.out); src.start();
    };
    if (this.buffers[name]) go(); else if (this.loading) this.loading.then(go);
  },

  // Мягкий «пип» для кнопок (синтез — он крошечный и не требует записи)
  pip() {
    const ac = this.ready(); if (!ac) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(1180, t + 0.07);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + 0.16);
  },

  voice(name, pitch = 1) {
    // мышка и хомячок сопят чуть выше и тише
    if (name === 'sniff') this.play('sniff', pitch * 1.15, 0.8);
    else this.play(name, pitch);
  },
};

/* =====================================================================
   ШАГ 5. КАМЕРА
   ---------------------------------------------------------------------
   Видео рисуем в canvas (а не показываем <video> напрямую): так рамка-подсказка
   и найденные метки точно совпадают с пикселями кадра. Изображение НЕ зеркалим:
   надписи на листе читаются правильно, и ребёнку понятно, какой угол куда.
   ===================================================================== */
// Рамка с запасом pad, обрезанная по границам кадра W×H (иначе Firefox может ругаться на drawImage)
function padRect(F, pad, W, H) {
  const x0 = Math.max(0, F.x - F.w * pad), y0 = Math.max(0, F.y - F.h * pad);
  const x1 = Math.min(W, F.x + F.w * (1 + pad)), y1 = Math.min(H, F.y + F.h * (1 + pad));
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

const Camera = {
  stream: null, facing: 'environment', raf: 0, found: null, lastCheck: 0, active: false,
  video: null, view: null,

  init() {
    this.video = document.getElementById('video');
    this.view = document.getElementById('camView');
    document.getElementById('btnShoot').onclick = () => this.shoot();
    document.getElementById('btnSwitch').onclick = () => {
      this.facing = this.facing === 'environment' ? 'user' : 'environment';
      this.close(); this.open();
    };
  },

  async open() {
    showScreen('camera');
    this.active = true;
    this.found = null;
    document.getElementById('camError').classList.add('hidden');
    const hint = document.getElementById('camHint');
    hint.classList.remove('hidden', 'ok');
    hint.textContent = 'Положи лист так, чтобы чёрные квадраты попали в углы рамки';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return this.fail();
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: this.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
      });
      if (!this.active) { this.close(); return; }   // пока ждали разрешение, ушли с экрана
      this.video.srcObject = this.stream;
      await this.video.play();
      cancelAnimationFrame(this.raf);
      this.loop();
    } catch (e) {
      console.warn('Камера недоступна:', e);
      this.fail();
    }
  },

  // Камеры нет → сразу предлагаем рисование на экране (или загрузку фото)
  fail() {
    document.getElementById('camHint').classList.add('hidden');
    document.getElementById('camError').classList.remove('hidden');
  },

  close() {
    this.active = false;
    cancelAnimationFrame(this.raf);
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = null;
    this.video.srcObject = null;
  },

  // Рамка в координатах кадра: пропорции листа А4, 90% кадра
  frameRect(vw, vh) {
    const asp = SHEET.w / SHEET.h;
    let fw = vw * 0.9, fh = fw / asp;
    if (fh > vh * 0.9) { fh = vh * 0.9; fw = fh * asp; }
    return { x: (vw - fw) / 2, y: (vh - fh) / 2, w: fw, h: fh };
  },

  loop() {
    if (!this.active) return;
    this.raf = requestAnimationFrame(() => this.loop());
    const v = this.video, vw = v.videoWidth, vh = v.videoHeight;
    if (!vw) return;
    const c = this.view, dpr = Math.min(2, window.devicePixelRatio || 1);
    const cw = c.clientWidth * dpr, ch = c.clientHeight * dpr;
    if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch; }
    const g = c.getContext('2d');
    // вписываем кадр целиком (contain)
    const k = Math.min(cw / vw, ch / vh), ox = (cw - vw * k) / 2, oy = (ch - vh * k) / 2;
    g.fillStyle = '#20283a'; g.fillRect(0, 0, cw, ch);
    g.drawImage(v, ox, oy, vw * k, vh * k);
    const F = this.frameRect(vw, vh);
    const fx = ox + F.x * k, fy = oy + F.y * k, fw = F.w * k, fh = F.h * k;

    // затемняем всё вокруг рамки
    g.fillStyle = 'rgba(0,0,0,.45)';
    g.beginPath(); g.rect(0, 0, cw, ch); g.rect(fx, fy, fw, fh); g.fill('evenodd');
    // белые уголки рамки
    const L = Math.min(fw, fh) * 0.12;
    g.strokeStyle = '#fff'; g.lineWidth = 8 * dpr; g.lineCap = 'round';
    g.beginPath();
    for (const [x, y, sx, sy] of [[fx, fy, 1, 1], [fx + fw, fy, -1, 1], [fx, fy + fh, 1, -1], [fx + fw, fy + fh, -1, -1]]) {
      g.moveTo(x + sx * L, y); g.lineTo(x, y); g.lineTo(x, y + sy * L);
    }
    g.stroke();
    // пунктирные квадраты — сюда должны лечь чёрные метки
    const mm = fw / SHEET.w;
    g.setLineDash([8 * dpr, 8 * dpr]); g.lineWidth = 3 * dpr;
    g.strokeStyle = this.found ? '#7CFC8A' : '#ffe066';
    for (const [mx, my] of MARK_CENTERS) g.strokeRect(fx + (mx - 15) * mm, fy + (my - 15) * mm, 30 * mm, 30 * mm);
    g.setLineDash([]);
    // найденные метки — зелёные кружочки
    if (this.found) {
      g.fillStyle = '#39d353';
      for (const [x, y] of this.found) { g.beginPath(); g.arc(ox + x * k, oy + y * k, 12 * dpr, 0, 7); g.fill(); }
    }
    // раз в 0,4 с пробуем найти метки прямо в живом видео — подсказка «всё готово»
    const now = performance.now();
    if (now - this.lastCheck > 400) {
      this.lastCheck = now;
      this.found = findMarkers(v, padRect(F, 0.06, vw, vh));
      const hint = document.getElementById('camHint');
      hint.classList.toggle('ok', !!this.found);
      hint.textContent = this.found ? '✅ Вижу все 4 квадрата — жми «📸 Снять»!' :
        'Положи лист так, чтобы чёрные квадраты попали в углы рамки';
    }
  },

  shoot() {
    const v = this.video, vw = v.videoWidth, vh = v.videoHeight;
    if (!vw) { toast('Камера ещё включается… 🙂'); return; }
    Sound.pip();
    const { canvas, k } = toWorkCanvas(v, vw, vh);
    const F = this.frameRect(vw, vh);
    const R = { x: F.x * k, y: F.y * k, w: F.w * k, h: F.h * k };
    // метки ищем с небольшим запасом вокруг рамки, а запасной вариант — ровно по рамке
    const search = padRect(R, 0.06, canvas.width, canvas.height);
    this.close();
    animate(() => photoWithSearch(canvas, search, R));
  },
};

// Поиск меток по расширенной области; запасной вариант — лист = рамка
function photoWithSearch(canvas, search, R) {
  const pts = findMarkers(canvas, search);
  if (pts) return photoToItem(canvas, search, App.animal);
  toast('Квадраты не нашлись — оживляю по рамке 🙂');
  return photoToItem(canvas, R, App.animal);
}

// Загрузка готового фото (из галереи телефона или папки ноутбука)
// id = 'fileInput' (галерея) или 'snapInput' (сразу камера телефона — работает даже там,
// где живое видео с камеры браузер не даёт)
function openUpload(id = 'fileInput') {
  const inp = document.getElementById(id);
  inp.value = '';
  inp.click();
}
function onFileChosen(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = () => { img.src = reader.result; };   // data:-URL не «пачкает» canvas даже при запуске через file://
  reader.readAsDataURL(file);
  img.onload = () => {
    Camera.close();
    const { canvas } = toWorkCanvas(img, img.naturalWidth, img.naturalHeight);
    const R = { x: 0, y: 0, w: canvas.width, h: canvas.height };
    animate(() => {
      const item = photoToItem(canvas, R, App.animal);
      if (!item.precise) toast('Квадраты не нашлись — оживляю всё фото 🙂');
      return item;
    });
  };
  img.onerror = () => toast('Не получилось открыть картинку 😿');
}

/* =====================================================================
   ШАГ 6. РИСОВАНИЕ НА ЭКРАНЕ (запасной режим без принтера и камеры)
   ---------------------------------------------------------------------
   Два слоя: «краска» (белый лист, по нему рисуем) и «контур» (чёрные линии
   шаблона, всегда поверх — поэтому линии никогда не закрашиваются).
   По умолчанию выбрана заливка 🪣 — маленьким детям так проще всего.
   ===================================================================== */
const COLORS = ['#ff5a5a', '#ff9f43', '#ffd93d', '#7bd148', '#2ecc71', '#5ad1ff',
                '#3a7bff', '#a66bff', '#ff8ad8', '#a0522d', '#9e9e9e', '#333333', '#ffffff'];
const Draw = {
  key: 'cat', view: null, paint: null, outline: null, tool: 'fill', color: COLORS[0],
  undo: [], drawing: false, last: null, dirty: false,

  init() {
    this.view = document.getElementById('drawCanvas');
    this.paint = makeCanvas(TEX.w, TEX.h);
    const pal = document.getElementById('palette');
    COLORS.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'swatch' + (i === 0 ? ' on' : '');
      b.style.background = c;
      b.title = c === '#ffffff' ? 'Ластик (белый)' : 'Цвет';
      b.onclick = () => {
        this.color = c; Sound.pip();
        pal.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s === b));
      };
      pal.appendChild(b);
    });
    document.querySelectorAll('#tools .tool').forEach(b => b.onclick = () => {
      this.tool = b.dataset.tool; Sound.pip();
      document.querySelectorAll('#tools .tool').forEach(s => s.classList.toggle('on', s === b));
    });
    const v = this.view;
    v.addEventListener('pointerdown', e => this.down(e));
    v.addEventListener('pointermove', e => this.move(e));
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => v.addEventListener(n, () => { this.drawing = false; }));
    document.getElementById('btnUndo').onclick = () => {
      const s = this.undo.pop(); Sound.pip();
      if (s) { ctx2d(this.paint).putImageData(s, 0, 0); this.render(); }
    };
    document.getElementById('btnClear').onclick = () => { Sound.pip(); this.saveUndo(); this.clear(); };
    document.getElementById('btnDone').onclick = () => {
      Sound.pip();
      const tex = makeCanvas(TEX.w, TEX.h), g = ctx2d(tex);
      g.drawImage(this.paint, 0, 0); g.drawImage(this.outline, 0, 0);
      animate(() => drawingToItem(tex, this.key));
    };
    window.addEventListener('resize', () => this.fit());
  },

  async open(key) {
    await App.ready;
    this.key = key;
    this.outline = ANIMALS[key].outline;      // контур картинки: белое уже прозрачное
    this.undo = [];
    this.clear();
    showScreen('draw');
    this.fit();
  },

  clear() {
    const g = ctx2d(this.paint);
    g.fillStyle = '#fff'; g.fillRect(0, 0, TEX.w, TEX.h);
    this.render();
  },

  // Вписываем квадратный холст в свободное место экрана
  fit() {
    const area = document.getElementById('drawArea');
    const W = area.clientWidth - 16, H = area.clientHeight - 16;
    if (W <= 0 || H <= 0) return;
    const k = Math.min(W / TEX.w, H / TEX.h);
    this.view.style.width = TEX.w * k + 'px';
    this.view.style.height = TEX.h * k + 'px';
  },

  render() {
    if (this.dirty) return;
    this.dirty = true;
    requestAnimationFrame(() => {             // не чаще одного раза за кадр
      this.dirty = false;
      const g = this.view.getContext('2d');
      g.drawImage(this.paint, 0, 0); g.drawImage(this.outline, 0, 0);
    });
  },

  pos(e) {
    const r = this.view.getBoundingClientRect();
    return [(e.clientX - r.left) * TEX.w / r.width, (e.clientY - r.top) * TEX.h / r.height];
  },
  saveUndo() {
    this.undo.push(ctx2d(this.paint).getImageData(0, 0, TEX.w, TEX.h));
    if (this.undo.length > 15) this.undo.shift();
  },

  down(e) {
    e.preventDefault();
    Sound.unlock();
    this.saveUndo();
    const [x, y] = this.pos(e);
    if (this.tool === 'fill') { this.fill(x | 0, y | 0); this.render(); return; }
    this.drawing = true; this.last = [x, y];
    try { this.view.setPointerCapture(e.pointerId); } catch (_) { /* старые браузеры — рисуем и без захвата */ }
    this.stroke(x, y);
  },
  move(e) {
    if (!this.drawing) return;
    let events = e.getCoalescedEvents ? e.getCoalescedEvents() : [];    // плавные линии при быстром движении
    if (!events.length) events = [e];
    for (const ev of events) { const [x, y] = this.pos(ev); this.stroke(x, y); }
  },
  stroke(x, y) {
    const g = ctx2d(this.paint);
    g.strokeStyle = this.color; g.lineCap = g.lineJoin = 'round';
    g.lineWidth = this.tool === 'big' ? 34 : 12;
    g.beginPath(); g.moveTo(this.last[0], this.last[1]); g.lineTo(x + 0.01, y); g.stroke();
    this.last = [x, y];
    this.render();
  },

  // Заливка «ведёрком»: границы — чёрные линии шаблона и уже закрашенные области другого цвета
  fill(sx, sy) {
    if (sx < 0 || sy < 0 || sx >= TEX.w || sy >= TEX.h) return;
    const W = TEX.w, H = TEX.h;
    const pg = ctx2d(this.paint), img = pg.getImageData(0, 0, W, H), d = img.data;
    const wall = ANIMALS[this.key].fillWall;                      // линии + невидимые границы частей
    const i0 = (sy * W + sx) * 4;
    if (wall[sy * W + sx]) return;                                // попали прямо в линию
    const r0 = d[i0], g0 = d[i0 + 1], b0 = d[i0 + 2];
    const nc = [parseInt(this.color.slice(1, 3), 16), parseInt(this.color.slice(3, 5), 16), parseInt(this.color.slice(5, 7), 16)];
    if (Math.abs(r0 - nc[0]) + Math.abs(g0 - nc[1]) + Math.abs(b0 - nc[2]) < 10) return;
    const seen = new Uint8Array(W * H), stack = [sy * W + sx];
    const ok = p => {
      if (seen[p]) return false;
      const o = p * 4;
      return !wall[p] && Math.abs(d[o] - r0) + Math.abs(d[o + 1] - g0) + Math.abs(d[o + 2] - b0) < 90;
    };
    while (stack.length) {
      const p = stack.pop();
      if (!ok(p)) continue;
      // построчная заливка: идём влево и вправо, потом добавляем строки выше и ниже
      let l = p, r = p;
      const row = (p / W) | 0, rs = row * W, re = rs + W - 1;
      while (l > rs && ok(l - 1)) l--;
      while (r < re && ok(r + 1)) r++;
      for (let q = l; q <= r; q++) {
        seen[q] = 1;
        const o = q * 4; d[o] = nc[0]; d[o + 1] = nc[1]; d[o + 2] = nc[2]; d[o + 3] = 255;
        if (row > 0 && ok(q - W)) stack.push(q - W);
        if (row < H - 1 && ok(q + W)) stack.push(q + W);
      }
    }
    // Невидимые границы на экране не нарисованы — докрашиваем их пиксели рядом с заливкой,
    // иначе между залитой лапой и туловищем осталась бы белая щёлочка.
    const cuts = ANIMALS[this.key].cutIdx;
    for (let pass = 0; pass < 3; pass++) {
      for (const p of cuts) {
        if (seen[p]) continue;
        if (seen[p - 1] === 1 || seen[p + 1] === 1 || seen[p - W] === 1 || seen[p + W] === 1) {
          seen[p] = 2;                                        // 2 — «докрашен», не распространяем дальше в этом проходе
          const o = p * 4; d[o] = nc[0]; d[o + 1] = nc[1]; d[o + 2] = nc[2]; d[o + 3] = 255;
        }
      }
      for (const p of cuts) if (seen[p] === 2) seen[p] = 1;
    }
    pg.putImageData(img, 0, 0);
  },
};

/* =====================================================================
   QR-КОД БЕЗ БИБЛИОТЕК (байтовый режим, коррекция ошибок «M», версии 1–15)
   ---------------------------------------------------------------------
   Классический алгоритм из стандарта ISO/IEC 18004: данные → блоки →
   коды Рида–Соломона → раскладка «змейкой» → маска. Нужен, чтобы показать
   ссылку для телефона прямо на экране поляны.
   ===================================================================== */
const QR = (() => {
  const ECC = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24];   // байт коррекции на блок
  const BLK = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10];                 // число блоков
  const rawModules = v => {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  };
  const dataCw = v => Math.floor(rawModules(v) / 8) - ECC[v] * BLK[v];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  const divisor = deg => {
    const r = new Array(deg).fill(0); r[deg - 1] = 1;
    let root = 1;
    for (let i = 0; i < deg; i++) {
      for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; }
      root = mul(root, 2);
    }
    return r;
  };
  const remainder = (data, div) => {
    const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); }
    return r;
  };
  const MASKS = [
    (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
    (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0,
  ];

  function encode(text, mask = 2) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1;
    for (; v <= 15; v++) if (4 + (v < 10 ? 8 : 16) + bytes.length * 8 <= dataCw(v) * 8) break;
    if (v > 15) throw new Error('Слишком длинная ссылка для QR');
    // 1) поток бит: режим «байты», длина, данные, терминатор, заполнители
    const bits = [], put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const cap = dataCw(v) * 8;
    put(0, Math.min(4, cap - bits.length)); put(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }
    // 2) блоки + коды Рида–Соломона, перемежение
    const nb = BLK[v], ecl = ECC[v], raw = Math.floor(rawModules(v) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = divisor(ecl), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - ecl + (i < nShort ? 0 : 1)); k += dat.length;
      const ec = remainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ec));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - ecl || j >= nShort) all.push(b[i]); });
    // 3) матрица: служебные узоры
    const n = v * 4 + 17;
    const m = Array.from({ length: n }, () => new Array(n).fill(false));
    const fn = Array.from({ length: n }, () => new Array(n).fill(false));
    const set = (x, y, d) => { m[y][x] = d; fn[y][x] = true; };
    for (let i = 0; i < n; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < n && y >= 0 && y < n) set(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(n - 4, 3); finder(3, n - 4);
    let al = [];
    if (v > 1) {
      const na = Math.floor(v / 7) + 2, step = Math.ceil((v * 4 + 4) / (na * 2 - 2)) * 2;
      al = [6];
      for (let pos = n - 7; al.length < na; pos -= step) al.splice(1, 0, pos);
    }
    al.forEach((ax, i) => al.forEach((ay, j) => {
      const last = al.length - 1;
      if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
    const drawFormat = msk => {
      const d = msk;                             // уровень M = 0b00
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((d << 10) | rem) ^ 0x5412, bit = i => ((b >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(n - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) set(8, n - 15 + i, bit(i));
      set(8, n - 8, true);
    };
    drawFormat(0);
    if (v >= 7) {
      let rem = v;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const b = (v << 12) | rem;
      for (let i = 0; i < 18; i++) { const bit = ((b >>> i) & 1) !== 0, a = n - 11 + i % 3, c = Math.floor(i / 3); set(a, c, bit); set(c, a, bit); }
    }
    // 4) данные «змейкой» снизу вверх парами столбцов
    let i = 0;
    for (let right = n - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < n; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? n - 1 - vert : vert;
        if (!fn[y][x] && i < all.length * 8) { m[y][x] = ((all[i >>> 3] >>> (7 - (i & 7))) & 1) !== 0; i++; }
      }
    }
    // 5) маска
    const mf = MASKS[mask];
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!fn[y][x] && mf(x, y)) m[y][x] = !m[y][x];
    drawFormat(mask);
    return m;
  }

  // Нарисовать QR на canvas (с белой «тихой зоной» в 4 модуля)
  function draw(canvas, text, px = 8) {
    const m = encode(text), n = m.length, q = 4, size = (n + 2 * q) * px;
    canvas.width = canvas.height = size;
    const g = canvas.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
    g.fillStyle = '#000';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) g.fillRect((x + q) * px, (y + q) * px, px, px);
  }
  return { encode, draw };
})();

/* =====================================================================
   ШАГ 7. ЗВЕРЯТА С ТЕЛЕФОНА (без своего сервера)
   ---------------------------------------------------------------------
   Файл на компьютере не умеет «принимать» картинки, поэтому нужен почтальон.
   Используем бесплатный открытый сервис ntfy.sh (без регистрации):
     • компьютер придумывает случайную «комнату» и слушает её (EventSource);
     • QR-код ведёт телефон на эту же страницу, размещённую в интернете
       (например, на GitHub Pages), с номером комнаты: …#room=abc123;
     • телефон сам фотографирует/раскрашивает, готовит картинку 720×720 (JPEG ~150 КБ)
       и отправляет её в комнату; компьютер получает и оживляет зверька.
   Лимиты ntfy.sh: картинка до 2 МБ, хранится 3 часа. Поэтому после перезагрузки
   страницы зверята за последние 3 часа возвращаются на поляну сами.
   Комнату знает только тот, кто видит QR-код на экране.
   ===================================================================== */

// ⚙️ Ссылка на страницу для телефона (этот же файл, выложенный в интернет).
// Если страница уже открыта по http(s) — берётся её собственный адрес.
const PHONE_PAGE = 'https://irinilou.github.io/zhivye-raskraski/';
const RELAY = 'https://ntfy.sh';

// Переживает сбои localStorage (приватный режим и т. п.)
const Store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* не страшно */ } },
};

function randomId(n) {
  const abc = 'abcdefghijkmnpqrstuvwxyz23456789', a = new Uint8Array(n);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return Array.from(a, v => abc[v % abc.length]).join('');
}

function phonePageUrl() {
  if (PHONE_PAGE && PHONE_PAGE.indexOf('__') !== 0) return PHONE_PAGE;
  if (/^https?:$/.test(location.protocol) && !/^(127\.|localhost)/.test(location.hostname)) return location.href.split('#')[0];
  return Store.get('zr-phone-page') || '';
}

const Relay = {
  room: null, es: null, seen: new Set(), status: 'off', clearedAt: 0,
  topic(room) { return 'zhivye-raskraski-' + room; },

  // Компьютер: начать слушать свою комнату
  listen() {
    if (this.es || !window.EventSource) return;
    this.room = Store.get('zr-room');
    if (!this.room) { this.room = randomId(10); Store.set('zr-room', this.room); }
    this.clearedAt = +(Store.get('zr-cleared') || 0);
    this.setStatus('connecting');
    // since=3h — вернуть зверят, присланных за последние 3 часа (пока живут картинки)
    this.es = new EventSource(`${RELAY}/${this.topic(this.room)}/sse?since=3h`);
    this.es.onopen = () => this.setStatus('on');
    this.es.onerror = () => this.setStatus(navigator.onLine === false ? 'offline' : 'connecting');   // браузер сам переподключится
    this.es.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.event !== 'message' || !m.attachment || this.seen.has(m.id)) return;
      this.seen.add(m.id);
      if (m.time * 1000 < this.clearedAt) return;                 // после 🧹 старых не возвращаем
      const quiet = Date.now() / 1000 - m.time > 20;              // старые — тихо, без фейерверка
      this.receive(m, quiet);
    };
  },

  setStatus(s) {
    this.status = s;
    const el = document.getElementById('relayStatus');
    if (el) el.textContent = { on: '🟢 Поляна ждёт зверят', connecting: '🟡 Подключаемся к интернету…', offline: '🔴 Нет интернета', off: '' }[s];
  },

  async receive(m, quiet) {
    let meta = {};
    try { meta = JSON.parse(m.message || '{}'); } catch (_) { return; }
    if (!ANIMALS[meta.k] || !/^https:\/\/ntfy\.sh\//.test(m.attachment.url)) return;   // чужие сообщения игнорируем
    try {
      await App.ready;
      const res = await fetch(m.attachment.url);
      if (!res.ok) return;                                       // картинка уже удалена (старше 3 часов)
      const blob = await res.blob();
      if (blob.size > 2.5e6) return;
      const img = await blobToImage(blob);
      const raw = makeCanvas(TEX.w, TEX.h);
      ctx2d(raw).drawImage(img, 0, 0, TEX.w, TEX.h);
      const cr = finishCreature({ raw, key: meta.k, precise: !!meta.p });
      cr.id = 'ntfy-' + m.id; cr.pitch = typeof meta.v === 'number' ? Math.max(0.8, Math.min(1.3, meta.v)) : undefined;
      if (Stage.has(cr.id)) return;
      const onHome = document.getElementById('home').classList.contains('active');
      if (!quiet && onHome) { showScreen('stage'); Stage.open(); }   // на главном экране — сразу на поляну
      if (!quiet && !document.getElementById('phonePanel').classList.contains('hidden')) closePhonePanel();   // большое окно с QR больше не мешает смотреть
      Stage.add(cr, { quiet });
      if (!quiet && !document.getElementById('stage').classList.contains('active')) toast(`${ANIMALS[meta.k].emoji} Новый зверёк прибежал на поляну!`);
      updateMeadowButton();
    } catch (e) { console.warn('Не получилось принять зверька', e); }
  },

  // Телефон: отправить зверька в комнату
  async send(room, item) {
    let q = 0.85, blob;
    for (;;) {
      blob = await new Promise(res => item.raw.toBlob(res, 'image/jpeg', q));
      if (blob.size < 400000 || q < 0.45) break;
      q -= 0.1;
    }
    const meta = JSON.stringify({ k: item.key, p: item.precise ? 1 : 0, v: +(0.9 + Math.random() * 0.25).toFixed(2) });
    const url = `${RELAY}/${this.topic(room)}?filename=zverek.jpg&message=${encodeURIComponent(meta)}`;
    const res = await fetch(url, { method: 'PUT', body: blob });
    if (!res.ok) throw new Error('ntfy ' + res.status);
  },
};

function blobToImage(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = e => { URL.revokeObjectURL(url); rej(e); };
    im.src = url;
  });
}

/* ---- Маленький QR в углу поляны: следующие дети сканируют, пока все смотрят ---- */
function showQrCorner() {
  const page = phonePageUrl();
  if (!page || !Relay.room) return;
  QR.draw(document.getElementById('qrSmall'), `${page}#room=${Relay.room}`, 4);
  document.getElementById('qrCorner').classList.remove('hidden');
}
function closePhonePanel() {
  document.getElementById('phonePanel').classList.add('hidden');
  if (Relay.room && phonePageUrl()) showQrCorner();
}

/* ---- Окошко «📱 С телефона» с QR-кодом (на компьютере) ---- */
function openPhonePanel() {
  Relay.listen();
  const body = document.getElementById('phoneBody'), page = phonePageUrl();
  if (!page) {
    body.innerHTML = `<div class="ph-title">📱 Зверята с телефона</div>
      <div class="ph-note">Чтобы телефоны могли присылать зверят, эта страница должна лежать в интернете
      (например, на GitHub Pages). Вставь сюда её адрес — он запомнится на этом компьютере:</div>
      <input id="phonePageInput" type="url" placeholder="https://…github.io/…/" inputmode="url">
      <button class="btn big b-go" id="phonePageSave">Сохранить</button>`;
    document.getElementById('phonePageSave').onclick = () => {
      const v = document.getElementById('phonePageInput').value.trim();
      if (/^https:\/\/\S+$/.test(v)) { Store.set('zr-phone-page', v); openPhonePanel(); }
      else toast('Нужен адрес, который начинается с https://');
    };
  } else {
    const link = `${page}#room=${Relay.room}`;
    body.innerHTML = `<div class="ph-title">📱 Зверята с телефона</div>
      <canvas id="qr"></canvas>
      <div class="ph-room">Комната: <b>${Relay.room}</b></div>
      <div id="relayStatus" class="ph-status"></div>
      <ol><li>Наведи камеру телефона на QR-код и открой ссылку.</li>
      <li>Выбери зверька и сфотографируй раскраску (или раскрась прямо в телефоне).</li>
      <li>Зверёк сам прибежит на эту поляну!</li></ol>
      <div class="ph-note">Нужен интернет на компьютере и телефоне. Можно с нескольких телефонов сразу.</div>`;
    QR.draw(document.getElementById('qr'), link, 8);
    Relay.setStatus(Relay.status);
  }
  document.getElementById('phonePanel').classList.remove('hidden');
}

/* =====================================================================
   ШАГ 8. РЕЖИМ ТЕЛЕФОНА-ПУЛЬТА (страница открыта по QR-коду: …#room=…)
   ===================================================================== */
const Phone = {
  room: null,
  detect() {
    const m = /[#&]room=([a-z0-9]{4,20})/.exec(location.hash);
    if (!m) return false;
    this.room = m[1];
    document.body.classList.add('phone-mode');
    document.getElementById('phoneTitle').textContent = '📱 Отправь зверька на большую поляну!';
    return true;
  },
  // Вместо показа на своей поляне — отправляем на компьютер
  async deliver(item) {
    await Relay.send(this.room, item);
    const cr = finishCreature(item);                       // картинка «что отправили» для радости
    const c = document.getElementById('sentPreview'), g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    const b = cr.body, k = Math.min(c.width / TEX.w, c.height / TEX.h);
    g.save(); g.scale(k, k);
    for (const p of cr.parts) if (p.P.layer === 'back' && p.sprite) g.drawImage(p.sprite.img, p.sprite.x, p.sprite.y, p.sprite.w, p.sprite.h);
    g.drawImage(b.img, b.x, b.y, b.w, b.h);
    for (const p of cr.parts) if (p.P.layer === 'front' && p.sprite) g.drawImage(p.sprite.img, p.sprite.x, p.sprite.y, p.sprite.w, p.sprite.h);
    g.restore();
    showScreen('sent');
  },
};

/* =====================================================================
   ШАГ 9. ГЛАВНОЕ МЕНЮ И СВЯЗКА ЭКРАНОВ
   ===================================================================== */
const App = { animal: 'cat', ready: null };

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  if (id !== 'camera') Camera.close();
  if (id !== 'stage') Stage.stop();          // поляна «засыпает», но зверьки остаются
  if (id === 'home') updateMeadowButton();
}

let toastTimer = 0;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// «Оживляем…»: заставка, расчёт, затем зверёк бежит на поляну (или улетает с телефона на компьютер).
// work() возвращает «сырую» картинку {raw, key, precise}.
function animate(work) {
  const busy = document.getElementById('busy');
  busy.classList.remove('hidden');
  const t0 = performance.now();
  App.ready.then(() => setTimeout(async () => {
    let item;
    try { item = work(); } catch (e) {
      console.error(e);
      busy.classList.add('hidden');
      toast('Ой, не получилось 😿 Попробуй ещё раз или раскрась на экране');
      showScreen('home');
      return;
    }
    App.animal = item.key; updateToggle();                // на случай, если программа сама узнала животное
    if (Phone.room) {
      try { await Phone.deliver(item); }
      catch (e) { console.warn(e); toast('Не получилось отправить 😿 Проверь интернет и попробуй ещё раз'); showScreen('home'); }
      busy.classList.add('hidden');
      return;
    }
    const cr = finishCreature(item);
    setTimeout(() => {
      busy.classList.add('hidden');
      showScreen('stage');
      Stage.open();
      cr.id = 'local-' + Date.now(); Stage.add(cr);
    }, Math.max(0, 800 - (performance.now() - t0)));
  }, 60));
}

function updateToggle() {
  document.querySelectorAll('#toggle .btn').forEach(b => b.classList.toggle('on', b.dataset.animal === App.animal));
  document.getElementById('preview').innerHTML = sheetSVG(App.animal, false);
}

// На главном экране — кнопка «На поляну», если там уже кто-то гуляет
function updateMeadowButton() {
  const n = Stage.herd.length, b = document.getElementById('btnMeadow');
  b.classList.toggle('hidden', !n);
  b.textContent = `🌳 На поляну (${n})`;
}

function init() {
  App.ready = prepareTemplates().catch(e => { console.error(e); toast('Не удалось подготовить шаблоны 😿'); });
  Stage.init(); Camera.init(); Draw.init();
  const phone = Phone.detect();

  // переключатель зверят строим из списка ANIMALS — легко добавить нового
  const tg = document.getElementById('toggle');
  for (const a of Object.values(ANIMALS)) {
    const b = document.createElement('button');
    b.className = 'btn'; b.dataset.animal = a.key; b.textContent = `${a.emoji} ${a.label}`;
    b.onclick = () => { App.animal = a.key; updateToggle(); Sound.pip(); Sound.voice(a.voice); };
    tg.appendChild(b);
  }
  updateToggle();

  document.getElementById('btnPrint').onclick = () => {
    Sound.pip();
    document.getElementById('printArea').innerHTML = sheetSVG(App.animal, true);
    setTimeout(() => window.print(), 80);
  };
  document.getElementById('btnCamera').onclick = () => { Sound.pip(); Camera.open(); };
  document.getElementById('btnSnap').onclick = () => { Sound.pip(); openUpload('snapInput'); };
  document.getElementById('btnDraw').onclick = () => { Sound.pip(); Draw.open(App.animal); };
  document.getElementById('btnAdd').onclick = () => { Sound.pip(); showScreen('home'); };
  document.getElementById('btnMeadow').onclick = () => { Sound.pip(); showScreen('stage'); Stage.open(); };
  document.getElementById('btnSendMore').onclick = () => { Sound.pip(); showScreen('home'); };
  document.querySelectorAll('[data-phone]').forEach(b => b.onclick = () => { Sound.pip(); openPhonePanel(); });
  document.getElementById('btnPhoneClose').onclick = () => { Sound.pip(); closePhonePanel(); };
  document.getElementById('qrCorner').onclick = () => { Sound.pip(); openPhonePanel(); };
  // Очистка — двойным нажатием, чтобы малыш не прогнал всех случайно
  let clearArmed = 0;
  document.getElementById('btnClear2').onclick = () => {
    Sound.pip();
    if (performance.now() - clearArmed < 3000) {
      clearArmed = 0; Stage.clear();
      Relay.clearedAt = Date.now(); Store.set('zr-cleared', String(Relay.clearedAt));
      toast('Поляна пустая — добавь новых зверят! 🌼');
    } else { clearArmed = performance.now(); toast('Нажми 🧹 ещё раз, чтобы все зверята ушли домой'); }
  };
  document.getElementById('btnSound').onclick = e => {
    Sound.muted = !Sound.muted;
    e.currentTarget.textContent = Sound.muted ? '🔇' : '🔊';
    Sound.pip();
  };
  document.getElementById('fileInput').addEventListener('change', onFileChosen);
  document.getElementById('snapInput').addEventListener('change', onFileChosen);

  // Общие кнопки с data-go (назад, рисовать, загрузить, сфотографировать)
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    Sound.pip();
    const go = b.dataset.go;
    if (go === 'home') showScreen('home');
    else if (go === 'draw') Draw.open(App.animal);
    else if (go === 'upload') openUpload('fileInput');
    else if (go === 'snap') openUpload('snapInput');
  }));

  // Первое касание где угодно «будит» звук (требование браузеров)
  window.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
  // Компьютер с поляной сразу начинает слушать свою комнату, если с неё уже присылали зверят
  if (!phone && Store.get('zr-room')) { Relay.listen(); showQrCorner(); }
}

init();
</script>
