<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Живые раскраски</title>
<!--
  «Живые раскраски» — один самодостаточный файл.
  Никаких CDN, библиотек и сетевых запросов: HTML + CSS + JS + SVG + синтез звука (Web Audio).
  Открывается двойным кликом, работает офлайн, можно носить на флешке.
-->
<style>
  /* ---------- Пастельная палитра ---------- */
  :root {
    --sky: #bfe6ff;
    --sky-light: #eaf8ff;
    --grass: #8fd67a;
    --sun: #ffd84d;
    --ink: #2d3a4a;
    --pink: #ff9ec7;
    --yellow: #ffe08a;
    --green: #a8e6a1;
    --lilac: #cdb8ff;
    --radius: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 20px;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-light), var(--sky));
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  .hidden { display: none !important; }

  /* ---------- Экраны: одновременно показан только один ---------- */
  .screen { display: none; position: fixed; inset: 0; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  /* ---------- Кнопки: крупные, «мягкие», с тенью-ступенькой ---------- */
  .btn {
    min-height: 64px; min-width: 64px;
    padding: 10px 22px;
    font: inherit; font-size: 24px; font-weight: 800;
    color: var(--ink);
    background: #fff;
    border: none; border-radius: var(--radius);
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s, filter .15s;
    touch-action: manipulation;
  }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .btn.big { width: 100%; min-height: 96px; font-size: 28px; }
  .b-print { background: var(--yellow); }
  .b-cam   { background: var(--pink); }
  .b-draw  { background: var(--green); }
  .b-go    { background: #7ee08a; }
  .b-soft  { background: #ffffffd9; }

  /* ---------- Главный экран ---------- */
  #home { overflow-y: auto; padding: 16px 16px 24px; gap: 14px; }
  #home h1 { margin: 6px 0 0; font-size: clamp(30px, 5vw, 48px); text-align: center; }
  .toggle { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; background: #ffffff80; padding: 8px; border-radius: 32px; }
  .toggle .btn { white-space: nowrap; font-size: 26px; background: transparent; box-shadow: none; }
  .toggle .btn.on { background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); outline: 4px solid var(--pink); }
  .home-main {
    display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px;
    width: 100%; max-width: 1100px; align-items: center;
  }
  .paper {
    background: #fff; border-radius: 14px; padding: 8px;
    box-shadow: 0 10px 30px rgba(40,80,120,.18);
    transform: rotate(-1.2deg);
  }
  .paper svg { display: block; width: 100%; height: auto; }
  .actions { display: flex; flex-direction: column; gap: 18px; }
  @media (max-width: 760px) {
    .home-main { grid-template-columns: 1fr; }
    .btn.big { min-height: 80px; font-size: 24px; }
  }

  /* ---------- Режим телефона-пульта ---------- */
  body:not(.phone-mode) .phone-only { display: none !important; }
  .phone-mode .pc-only { display: none !important; }
  #sent { justify-content: center; padding: 16px; overflow-y: auto; }
  .sent-box { display: flex; flex-direction: column; gap: 16px; align-items: center; width: min(100%, 480px); text-align: center; }
  .sent-title { font-size: 28px; font-weight: 800; }
  #sentPreview { width: min(320px, 80vw); height: auto; }
  .ph-room { text-align: center; font-size: 18px; }
  .ph-status { text-align: center; font-size: 18px; min-height: 1.4em; }
  .qr-corner { position: absolute; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: #fff; border: none; border-radius: 16px; padding: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.2); font: inherit; font-size: 15px; font-weight: 800; color: var(--ink); cursor: pointer; }
  .qr-corner canvas { width: 118px; height: 118px; image-rendering: pixelated; }
  @media (max-width: 520px) { .toggle .btn { font-size: 20px; padding: 8px 12px; min-height: 54px; } }
  #phonePageInput { font: inherit; font-size: 18px; padding: 12px; border-radius: 14px; border: 2px solid #c9d3e6; width: 100%; }

  /* ---------- Окошко «С телефона» ---------- */
  .overlay { position: fixed; inset: 0; z-index: 40; background: #0006; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .overlay .panel { position: static; margin: 0; max-height: 100%; overflow-y: auto; }
  .panel.phone { font-size: 20px; font-weight: 600; text-align: left; }
  .ph-title { font-size: 28px; font-weight: 800; text-align: center; }
  .panel.phone canvas { display: block; width: min(300px, 70vw); height: auto; margin: 8px auto; image-rendering: pixelated; border-radius: 12px; }
  .panel.phone ol { margin: 6px 0; padding-left: 26px; line-height: 1.4; }
  .ph-note { font-size: 18px; font-weight: 500; opacity: .8; }
  .ph-url { font-size: 14px; word-break: break-all; opacity: .6; text-align: center; }
  .panel.phone a.btn { display: flex; align-items: center; justify-content: center; text-decoration: none; }

  /* ---------- Экран камеры ---------- */
  #camera { background: #20283a; }
  .cam-wrap { position: relative; flex: 1; width: 100%; min-height: 0; }
  #camView { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .cam-hint {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    width: min(92%, 760px);
    background: #fffbe8; border-radius: 20px; padding: 10px 18px;
    font-size: 22px; font-weight: 700; text-align: center;
    box-shadow: 0 6px 16px rgba(0,0,0,.25);
  }
  .cam-hint.ok { background: #c9f7c4; }
  .panel {
    position: absolute; inset: 0; margin: auto; height: fit-content;
    width: min(92%, 560px);
    background: #fff; border-radius: 28px; padding: 26px;
    display: flex; flex-direction: column; gap: 16px; align-items: stretch;
    text-align: center; font-size: 24px; font-weight: 700;
  }
  .panel .emoji { font-size: 64px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    width: 100%;
  }
  #camera .bar { background: #2e3850; }
  #btnShoot { min-width: 220px; font-size: 30px; background: #ffd84d; }

  /* ---------- Экран рисования ---------- */
  #draw { background: #fff6e9; }
  #draw .bar { background: #ffe9c7; }
  .draw-area { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; padding: 8px; }
  #drawCanvas {
    background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
    touch-action: none; cursor: crosshair;
  }
  .palette { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  .swatch {
    width: 52px; height: 52px; border-radius: 50%;
    border: 4px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.2);
    cursor: pointer; touch-action: manipulation;
  }
  .swatch.on { outline: 5px solid var(--ink); outline-offset: 2px; transform: scale(1.1); }
  .tool.on { outline: 4px solid var(--ink); }
  .sep { width: 2px; align-self: stretch; background: #0002; margin: 0 4px; }

  /* ---------- Сцена ---------- */
  #stage { background: var(--sky); }
  #stageCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; }
  .stage-bar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 12px; justify-content: space-between; pointer-events: none; }
  .stage-bar .btn { pointer-events: auto; }
  .stage-bar .grp { display: flex; gap: 12px; }
  #stageHint {
    position: absolute; left: 50%; top: 96px; transform: translateX(-50%);
    background: #fff; padding: 10px 20px; border-radius: 20px; font-weight: 800; font-size: 24px;
    box-shadow: 0 6px 0 rgba(0,0,0,.12); pointer-events: none; white-space: nowrap;
    animation: bounce 1.2s ease-in-out infinite; transition: opacity .6s;
  }
  @keyframes bounce { 50% { transform: translate(-50%, -8px); } }

  /* ---------- «Оживляем…» и всплывающие подсказки ---------- */
  .busy {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #ffffffd0; font-size: 34px; font-weight: 800;
  }
  .busy .spark { font-size: 90px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) scale(1.1); } }
  .toast {
    position: fixed; left: 50%; bottom: 110px; z-index: 60;
    transform: translate(-50%, 30px); opacity: 0;
    background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 18px;
    font-size: 20px; font-weight: 700; max-width: 92%; text-align: center;
    transition: opacity .3s, transform .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Печать: только шаблон, А4 альбомный, без полей ----------
     Альбомная ориентация выбрана намеренно: животное в профиль широкое,
     а кадр веб-камеры тоже горизонтальный — лист заполняет кадр целиком. */
  #printArea { display: none; }
  @page { size: A4 landscape; margin: 0; }
  @media print {
    html, body { background: #fff !important; overflow: visible !important; height: auto; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea svg { display: block; width: 297mm; height: 209mm; }
  }
</style>
</head>
<body>

<!-- ================= ГЛАВНЫЙ ЭКРАН ================= -->
<section id="home" class="screen active">
  <h1 id="phoneTitle">🐾 Живые раскраски</h1>
  <div class="toggle" id="toggle" role="radiogroup" aria-label="Животное"></div>
  <div class="home-main">
    <div class="paper" id="preview"></div>
    <div class="actions">
      <button id="btnPrint" class="btn big b-print pc-only">🖨️ Распечатать раскраску</button>
      <button id="btnCamera" class="btn big b-cam pc-only">📷 Оживить рисунок</button>
      <button id="btnSnap" class="btn big b-cam phone-only">📸 Сфотографировать раскраску</button>
      <button class="btn big phone-only" data-go="upload" style="background:#e8f1ff">🖼️ Фото из галереи</button>
      <button id="btnDraw" class="btn big b-draw">🎨 Нарисовать на экране</button>
      <button class="btn big pc-only" data-phone style="background:var(--lilac)">📱 С телефона</button>
      <button id="btnMeadow" class="btn big hidden pc-only" style="background:#bfe6ff">🌳 На поляну</button>
    </div>
  </div>
</section>

<!-- ================= КАМЕРА ================= -->
<section id="camera" class="screen">
  <div class="cam-wrap">
    <canvas id="camView"></canvas>
    <video id="video" playsinline muted autoplay></video>
    <div id="camHint" class="cam-hint">Положи лист так, чтобы чёрные квадраты попали в углы рамки</div>
    <div id="camError" class="panel hidden">
      <div class="emoji">😿</div>
      <div>Живая камера не включилась.<br>Можно сфотографировать лист или раскрасить на экране!</div>
      <button class="btn big b-cam" data-go="snap">📸 Сфотографировать</button>
      <button class="btn big b-draw" data-go="draw">🎨 Нарисовать на экране</button>
      <button class="btn big b-soft" data-go="upload" style="background:#e8f1ff">🖼️ Загрузить фото</button>
    </div>
  </div>
  <div class="bar">
    <button class="btn" data-go="home">⬅️</button>
    <button id="btnSwitch" class="btn" title="Другая камера">🔁</button>
    <button id="btnShoot" class="btn">📸 Снять</button>
    <button class="btn" data-go="upload" title="Загрузить фото">🖼️</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" hidden>
  <input type="file" id="snapInput" accept="image/*" capture="environment" hidden>
</section>

<!-- ================= РИСОВАНИЕ НА ЭКРАНЕ ================= -->
<section id="draw" class="screen">
  <div class="bar">
    <button class="btn" data-go="home">⬅️</button>
    <button id="btnUndo" class="btn" title="Отменить">↩️</button>
    <button id="btnClear" class="btn" title="Стереть всё">🗑️</button>
    <button id="btnDone" class="btn b-go">✅ Готово!</button>
  </div>
  <div class="draw-area" id="drawArea"><canvas id="drawCanvas" width="720" height="720"></canvas></div>
  <div class="bar">
    <div class="palette" id="tools">
      <button class="btn tool on" data-tool="fill" title="Заливка">🪣</button>
      <button class="btn tool" data-tool="big" title="Толстая кисть">🖌️</button>
      <button class="btn tool" data-tool="small" title="Тонкая кисть">✏️</button>
    </div>
    <div class="sep"></div>
    <div class="palette" id="palette"></div>
  </div>
</section>

<!-- ================= СЦЕНА С ОЖИВШИМ ЗВЕРЬКОМ ================= -->
<section id="stage" class="screen">
  <canvas id="stageCanvas"></canvas>
  <div class="stage-bar">
    <button id="btnAdd" class="btn b-soft">➕ Ещё зверёк</button>
    <div class="grp">
      <button class="btn b-soft" data-phone title="Добавить с телефона">📱</button>
      <button id="btnClear2" class="btn b-soft" title="Очистить поляну">🧹</button>
      <button id="btnSound" class="btn b-soft" title="Звук">🔊</button>
    </div>
  </div>
  <div id="stageHint">👆 Погладь зверька!</div>
  <button id="qrCorner" class="qr-corner hidden" title="Добавить зверька с телефона">
    <canvas id="qrSmall"></canvas><span>📱 Добавь зверька</span>
  </button>
</section>

<div id="phonePanel" class="overlay hidden">
  <div class="panel phone">
    <div id="phoneBody"></div>
    <button id="btnPhoneClose" class="btn big b-soft" style="background:#eef3ff">👌 Понятно</button>
  </div>
</div>
<div id="busy" class="busy hidden"><div class="spark">✨</div><div>Оживляем…</div></div>
<!-- ================= ТЕЛЕФОН: «ОТПРАВЛЕНО!» ================= -->
<section id="sent" class="screen">
  <div class="sent-box">
    <div class="sent-title">🎉 Зверёк побежал на большую поляну!</div>
    <canvas id="sentPreview" width="320" height="320"></canvas>
    <div class="ph-note">Смотри на экран компьютера — он уже там.</div>
    <button id="btnSendMore" class="btn big b-go">➕ Отправить ещё зверька</button>
  </div>
</section>
<div id="toast" class="toast"></div>
<div id="printArea"></div>

<script>
'use strict';
/* =====================================================================
   ШАГ 1. ЛИСТ И ШАБЛОНЫ-КАРТИНКИ
   ---------------------------------------------------------------------
   • Лист — А4 альбомный (297×210 мм): кадр камеры тоже горизонтальный.
   • Кошечка, собачка, мышка и хомячок — готовые картинки-раскраски
     (1254×1254), встроены прямо в файл (WebP в base64). Интернет не нужен.
   • Чтобы зверёк «ожил», программа при запуске сама размечает картинку:
       – силуэт = всё, что не соединено с белым краем листа;
       – каждая подвижная часть (лапа, ушко, хвост) = область, залитая
         «ведёрком» из точки-семечка. Там, где часть переходит в туловище,
         линии нет — её заменяет невидимый «разрез» (cut), заданный вручную.
   ===================================================================== */

const SHEET = { w: 297, h: 210 };                 // А4 альбомный, мм
const BOX = { x: 68.5, y: 9, w: 160, h: 160 };    // квадратное окно с картинкой на листе, мм
const TEX = { w: 720, h: 720 };                   // текстура рисунка: 4,5 пикселя на мм
const IMG = 1254;                                 // размер исходных картинок
const K = TEX.w / IMG;                            // перевод координат картинки → текстура
const MAX_HERD = 35;                              // сколько зверят одновременно гуляет на поляне

// Чёрные квадраты-метки 30×30 мм, отступ 8 мм от края. Центры меток — опорные точки для камеры.
const MARK = { size: 30, margin: 8 };
const MARK_CENTERS = [                            // порядок: ЛВ, ПВ, ЛН, ПН
  [MARK.margin + 15, MARK.margin + 15],
  [SHEET.w - MARK.margin - 15, MARK.margin + 15],
  [MARK.margin + 15, SHEET.h - MARK.margin - 15],
  [SHEET.w - MARK.margin - 15, SHEET.h - MARK.margin - 15],
];

/* Разметка частей (в пикселях исходной картинки 1254×1254):
   kind  — leg (шагающая лапа), paw (передняя лапка, которой «машут»), ear (ушко), tail (хвост);
   seed  — точка внутри части; cut — «разрез» между частью и туловищем (если нет линии);
   pivot — ось вращения (если не задана — середина разреза или верх области);
   layer — front: часть перед туловищем (рисуется поверх), back: за ним;
   pair  — лапы одной пары двигаются вместе (у кошки и собаки — по диагонали, как у настоящих зверей);
   gait  — walk: идёт шагом, hop: скачет (мышка и хомячок сидят столбиком и прыгают). */
const ANIMALS = {

/* ---- SVG листа для печати и превью ---- */
function sheetSVG(key, forPrint) {
  const a = ANIMALS[key];
  const size = forPrint ? 'width="297mm" height="210mm"' : '';
  // Метки: чёрный квадрат 30×30 мм и белая «рамка»-поле 4 мм вокруг (тонкий пунктир лишь
  // показывает её границу). Белое поле нужно, чтобы раскраска не «прилипла» к квадрату.
  const marks = [[MARK.margin, MARK.margin], [SHEET.w - MARK.margin - 30, MARK.margin],
                 [MARK.margin, SHEET.h - MARK.margin - 30], [SHEET.w - MARK.margin - 30, SHEET.h - MARK.margin - 30]]
    .map(([x, y]) => `<rect x="${x - 4}" y="${y - 4}" width="38" height="38" rx="2" fill="#fff" stroke="#bbb" stroke-width="0.4" stroke-dasharray="1.5 1.5"/>` +
                     `<rect x="${x}" y="${y}" width="30" height="30" fill="#000"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${SHEET.w} ${SHEET.h}" ${size}>
    <rect width="${SHEET.w}" height="${SHEET.h}" fill="#fff"/>
    ${marks}
    <image href="${a.src}" xlink:href="${a.src}" x="${BOX.x}" y="${BOX.y}" width="${BOX.w}" height="${BOX.h}" preserveAspectRatio="none"/>
    <text x="${SHEET.w / 2}" y="184" font-family="system-ui, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#000">${a.name}</text>
    <text x="${SHEET.w / 2}" y="197" font-family="system-ui, Arial, sans-serif" font-size="7" text-anchor="middle" fill="#000">Раскрась меня и покажи в камеру!</text>
  </svg>`;
}

/* ---- Помощники для холстов и масок ---- */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctx2d(c) { return c.getContext('2d', { willReadFrequently: true }); }

// Маска (0/1) из альфа-канала холста
function alphaMask(c, thr = 128) {
  const d = ctx2d(c).getImageData(0, 0, c.width, c.height).data;
  const m = new Uint8Array(c.width * c.height);
  for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] >= thr ? 1 : 0;
  return m;
}
// Маска → холст (чёрный там, где 1) — для наложения через globalCompositeOperation
function maskCanvas(m) {
  const c = makeCanvas(TEX.w, TEX.h), g = ctx2d(c), img = g.createImageData(TEX.w, TEX.h);
  for (let i = 0; i < m.length; i++) img.data[i * 4 + 3] = m[i] ? 255 : 0;
  g.putImageData(img, 0, 0);
  return c;
}
// Нарисовать толстую линию и получить её маску
function lineMask(pts, width) {
  const c = makeCanvas(TEX.w, TEX.h), g = c.getContext('2d');
  g.lineWidth = width; g.lineCap = 'butt'; g.strokeStyle = '#000';
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x * K, y * K) : g.moveTo(x * K, y * K)); g.stroke();
  return alphaMask(c, 100);
}
// Заливка «ведёрком» по маске: идём по клеткам, где wall = 0
function floodMask(wall, seeds) {
  const W = TEX.w, H = TEX.h, out = new Uint8Array(W * H), stack = [];
  for (const [x, y] of seeds) { const p = y * W + x; if (!wall[p]) { out[p] = 1; stack.push(p); } }
  while (stack.length) {
    const p = stack.pop(), x = p % W;
    const nb = [x > 0 ? p - 1 : -1, x < W - 1 ? p + 1 : -1, p - W, p + W];
    for (const q of nb) if (q >= 0 && q < W * H && !out[q] && !wall[q]) { out[q] = 1; stack.push(q); }
  }
  return out;
}
function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}

/* ---- Разметка шаблонов при запуске (≈0,4 с на четырёх зверят) ---- */
async function prepareTemplates() {
  const W = TEX.w, H = TEX.h, N = W * H;
  for (const a of Object.values(ANIMALS)) {
    const img = await loadImage(a.src);
    const c = makeCanvas(W, H), g = ctx2d(c);
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    g.drawImage(img, 0, 0, W, H);
    const d = g.getImageData(0, 0, W, H).data;

    // линии шаблона и слой-контур для рисования на экране (белое → прозрачное)
    const dark = new Uint8Array(N);
    const oc = makeCanvas(W, H), og = ctx2d(oc), oimg = og.createImageData(W, H);
    for (let i = 0; i < N; i++) {
      const L = (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 3;
      dark[i] = L < 140 ? 1 : 0;
      oimg.data[i * 4 + 3] = 255 - L;
    }
    og.putImageData(oimg, 0, 0);
    a.dark = dark; a.outline = oc;

    // силуэт: всё, куда нельзя «протечь» от края листа
    const edge = [];
    for (let x = 0; x < W; x += 4) edge.push([x, 0], [x, H - 1]);
    for (let y = 0; y < H; y += 4) edge.push([0, y], [W - 1, y]);
    const outside = floodMask(dark, edge);
    a.sil = new Uint8Array(N);
    for (let i = 0; i < N; i++) a.sil[i] = outside[i] ? 0 : 1;

    // точка опоры зверька: середина низа силуэта (там, где лапы касаются травы)
    let x0 = W, x1 = 0, y0 = H, y1 = 0;
    for (let i = 0; i < N; i++) if (a.sil[i]) { const x = i % W, y = (i / W) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    a.anchor = { x: (x0 + x1) / 2, y: y1 - 3, w: x1 - x0, h: y1 - y0 };

    // подвижные части — сначала находим области
    const parts = a.parts;
    for (const P of parts) {
      let wall = dark;
      if (P.cut) { const cut = lineMask(P.cut, 4); wall = dark.map((v, i) => v | cut[i]); }
      P.region = floodMask(wall, [[Math.round(P.seed[0] * K), Math.round(P.seed[1] * K)]]);
    }
    // «Светлое тело» — всё белое внутри силуэта, что не относится к подвижным частям.
    // Линии, которые граничат с ним, остаются туловищу; остальные линии вокруг части уходят вместе с ней
    // (иначе на месте шагнувшей лапы остаётся бледный «призрак» контура).
    const bodyLight = new Uint8Array(N);
    for (let i = 0; i < N; i++) bodyLight[i] = a.sil[i] && !dark[i] && !parts.some(P => P.region[i]) ? 1 : 0;
    const bodyKeep = morph(bodyLight, W, H, 3, true);
    for (const P of parts) {
      const region = P.region;
      const near = morph(region, W, H, 10, true);            // область + её контур целиком
      // Без ограничения силуэтом: на фото линии могут сдвинуться на 1–3 px за край шаблона.
      P.core = near.map((v, i) => v & !bodyKeep[i]);          // это вычтем из туловища
      let full = near;                                        // это — спрайт части (фон там уже прозрачный)
      // «нахлёст» над разрезом: при движении части не будет щели между ней и туловищем
      if (P.cut) { const band = lineMask(P.cut, 18); full = full.map((v, i) => v | (band[i] & a.sil[i])); }
      P.mask = full;
      let px = 0, n = 0, top = H, bottom = 0;
      for (let i = 0; i < N; i++) if (region[i]) { const y = (i / W) | 0; px += i % W; n++; if (y < top) top = y; if (y > bottom) bottom = y; }
      P.foot = [px / n, bottom];
      // ось вращения: заданная вручную, середина разреза или верх области
      P.pivotT = P.pivot ? [P.pivot[0] * K, P.pivot[1] * K]
               : P.cut ? [(P.cut[0][0] + P.cut[1][0]) / 2 * K, (P.cut[0][1] + P.cut[1][1]) / 2 * K]
               : [px / n, top];
      P.len = Math.max(40, bottom - P.pivotT[1]);             // длина лапы: от оси до подушечки
    }
    const legs = parts.filter(P => P.kind === 'leg');
    a.legLen = legs.length ? legs.reduce((s, P) => s + P.len, 0) / legs.length : 100;
    // Стенки для заливки «ведёрком» на экране: линии картинки + невидимые разрезы,
    // чтобы голова, туловище, каждая лапа, ушко и хвост заливались отдельно.
    a.fillWall = dark.slice();
    for (const cut of [a.headCut, ...parts.map(P => P.cut)].filter(Boolean)) {
      const m = lineMask(cut, 3);
      for (let i = 0; i < N; i++) if (m[i]) a.fillWall[i] = 1;
    }
    a.cutIdx = [];                                            // пиксели невидимых границ (не линии картинки)
    for (let i = W; i < N - W; i++) if (a.fillWall[i] && !dark[i]) a.cutIdx.push(i);
    // всё подвижное вместе — чтобы вычесть из туловища
    a.limbs = new Uint8Array(N);
    for (const P of parts) for (let i = 0; i < N; i++) if (P.core[i]) a.limbs[i] = 1;
  }
}

/* =====================================================================
   ШАГ 2. КАМЕРА → ТЕКСТУРА: поиск меток, выпрямление, вырезание фона
   ---------------------------------------------------------------------
   Без OpenCV: всё на чистом Canvas 2D и типизированных массивах.
   Бюджет времени < 2 с: самые тяжёлые операции идут по картинке 800×600
   (≈0,5 млн пикселей) — на обычном школьном ноутбуке это 100–300 мс.
   ===================================================================== */

/* ---- Гомография (перспективное преобразование) по 4 точкам ----
   Нужна, чтобы «выпрямить» лист, снятый под углом. Решаем систему 8×8 методом Гаусса. */
function solveLinear(A, b) {
  const n = b.length;
  for (let i = 0; i < n; i++) A[i] = A[i].concat(b[i]);
  for (let c = 0; c < n; c++) {
    let piv = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    if (Math.abs(A[piv][c]) < 1e-10) return null;
    [A[c], A[piv]] = [A[piv], A[c]];
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k <= n; k++) A[r][k] -= f * A[c][k];
    }
  }
  return A.map((row, i) => row[n] / row[i]);
}
// Возвращает H такую, что H·src ≈ dst
function homography(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  const h = solveLinear(A, b);
  return h ? [...h, 1] : null;
}
function applyH(H, x, y) {
  const w = H[6] * x + H[7] * y + H[8];
  return [(H[0] * x + H[1] * y + H[2]) / w, (H[3] * x + H[4] * y + H[5]) / w];
}

/* ---- Поиск чёрных квадратов по углам ----
   source — video/canvas/img, R — область поиска {x,y,w,h} в пикселях источника.
   1) уменьшаем до ~400 px (быстро и шум меньше);
   2) порог «тёмного» считаем от яркости бумаги (работает и при тусклом свете);
   3) находим связные тёмные пятна (заливка очередью);
   4) оставляем «квадратные и плотные» пятна, в каждой четверти берём ближайшее к углу. */
function findMarkers(source, R) {
  const k = Math.min(1, 400 / R.w);
  const w = Math.max(40, Math.round(R.w * k)), h = Math.max(30, Math.round(R.h * k));
  const c = makeCanvas(w, h), g = ctx2d(c);
  g.drawImage(source, R.x, R.y, R.w, R.h, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  const n = w * h, lum = new Uint8Array(n), hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) {
    const L = (d[i * 4] * 77 + d[i * 4 + 1] * 150 + d[i * 4 + 2] * 29) >> 8;
    lum[i] = L; hist[L]++;
  }
  // яркость бумаги ≈ 90-й перцентиль
  let acc = 0, paper = 255;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= n * 0.9) { paper = v; break; } }
  const thr = Math.max(35, Math.min(120, paper * 0.45));

  const lab = new Int32Array(n), queue = new Int32Array(n), comps = [];
  let id = 0;
  for (let s = 0; s < n; s++) {
    if (lum[s] >= thr || lab[s]) continue;
    id++;
    let qh = 0, qt = 0, area = 0, sx = 0, sy = 0, x0 = w, x1 = 0, y0 = h, y1 = 0;
    queue[qt++] = s; lab[s] = id;
    while (qh < qt) {
      const p = queue[qh++], x = p % w, y = (p / w) | 0;
      area++; sx += x; sy += y;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0 && !lab[p - 1] && lum[p - 1] < thr) { lab[p - 1] = id; queue[qt++] = p - 1; }
      if (x < w - 1 && !lab[p + 1] && lum[p + 1] < thr) { lab[p + 1] = id; queue[qt++] = p + 1; }
      if (y > 0 && !lab[p - w] && lum[p - w] < thr) { lab[p - w] = id; queue[qt++] = p - w; }
      if (y < h - 1 && !lab[p + w] && lum[p + w] < thr) { lab[p + w] = id; queue[qt++] = p + w; }
    }
    comps.push({ area, cx: sx / area, cy: sy / area, bw: x1 - x0 + 1, bh: y1 - y0 + 1 });
  }
  const side = Math.min(w, h);
  const minA = (side * 0.035) ** 2, maxA = (side * 0.25) ** 2;
  const good = comps.filter(q => {
    const ar = q.bw / q.bh, fill = q.area / (q.bw * q.bh);
    return q.area >= minA && q.area <= maxA && ar > 0.5 && ar < 2 && fill > 0.55;
  });
  const corners = [[0, 0], [w, 0], [0, h], [w, h]];
  const pick = corners.map(([cx, cy]) => {
    let best = null, bd = Infinity;
    for (const q of good) {
      if ((q.cx < w / 2) !== (cx === 0) || (q.cy < h / 2) !== (cy === 0)) continue; // только своя четверть
      const dist = Math.hypot(q.cx - cx, q.cy - cy);
      if (dist < bd) { bd = dist; best = q; }
    }
    return best;
  });
  if (pick.some(q => !q)) return null;
  // Проверка здравого смысла: метки примерно одного размера и образуют большой четырёхугольник
  const areas = pick.map(q => q.area);
  if (Math.max(...areas) > 5 * Math.min(...areas)) return null;
  const [a, b, cc, dd] = pick;
  const quadArea = Math.abs((b.cx - a.cx) * (cc.cy - a.cy) - (cc.cx - a.cx) * (b.cy - a.cy)) / 2 +
                   Math.abs((b.cx - dd.cx) * (cc.cy - dd.cy) - (cc.cx - dd.cx) * (b.cy - dd.cy)) / 2;
  if (quadArea < w * h * 0.12) return null;
  return pick.map(q => [R.x + q.cx / k, R.y + q.cy / k]);
}

/* ---- Выпрямление: берём из фото только «окно» с животным и кладём в текстуру 800×600 ---- */
function rectify(srcCanvas, H) {
  const sw = srcCanvas.width, sh = srcCanvas.height;
  const sd = ctx2d(srcCanvas).getImageData(0, 0, sw, sh).data;
  const out = makeCanvas(TEX.w, TEX.h), og = ctx2d(out);
  const img = og.createImageData(TEX.w, TEX.h), od = img.data;
  const sx0 = BOX.w / TEX.w, sy0 = BOX.h / TEX.h;   // мм на пиксель текстуры
  for (let v = 0; v < TEX.h; v++) {
    const Y = BOX.y + (v + 0.5) * sy0;
    for (let u = 0; u < TEX.w; u++) {
      const X = BOX.x + (u + 0.5) * sx0;
      const w = H[6] * X + H[7] * Y + H[8];
      const sx = (H[0] * X + H[1] * Y + H[2]) / w - 0.5, sy = (H[3] * X + H[4] * Y + H[5]) / w - 0.5;
      const o = (v * TEX.w + u) * 4;
      if (sx < 0 || sy < 0 || sx >= sw - 1 || sy >= sh - 1) { od[o] = od[o + 1] = od[o + 2] = od[o + 3] = 255; continue; }
      // билинейная интерполяция — края получаются гладкими
      const x0 = sx | 0, y0 = sy | 0, fx = sx - x0, fy = sy - y0;
      const i00 = (y0 * sw + x0) * 4, i10 = i00 + 4, i01 = i00 + sw * 4, i11 = i01 + 4;
      for (let ch = 0; ch < 3; ch++) {
        const top = sd[i00 + ch] + (sd[i10 + ch] - sd[i00 + ch]) * fx;
        const bot = sd[i01 + ch] + (sd[i11 + ch] - sd[i01 + ch]) * fx;
        od[o + ch] = top + (bot - top) * fy;
      }
      od[o + 3] = 255;
    }
  }
  og.putImageData(img, 0, 0);
  return out;
}

/* ---- Баланс белого и «сочность» ----
   Камера видит белую бумагу серой/желтоватой. Находим цвет бумаги (по пикселям ВНЕ силуэта,
   если он известен, иначе по самым светлым) и растягиваем каналы, чтобы бумага стала белой.
   Затем чуть усиливаем насыщенность: карандаши на фото выглядят бледнее, чем в жизни. */
function whiteBalance(c, paperMask) {
  const g = ctx2d(c), img = g.getImageData(0, 0, c.width, c.height), d = img.data, n = c.width * c.height;
  const hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) if (!paperMask || paperMask[i]) hist[(d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 3 | 0]++;
  let total = 0; for (const v of hist) total += v;
  let acc = 0, cut = 200;
  for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= total * 0.4) { cut = v; break; } }
  let r = 0, gg = 0, b = 0, cnt = 0;
  for (let i = 0; i < n; i++) {
    if (paperMask && !paperMask[i]) continue;
    const o = i * 4;
    if ((d[o] + d[o + 1] + d[o + 2]) / 3 >= cut) { r += d[o]; gg += d[o + 1]; b += d[o + 2]; cnt++; }
  }
  if (!cnt) return;
  const kr = Math.min(3, 250 / (r / cnt)), kg = Math.min(3, 250 / (gg / cnt)), kb = Math.min(3, 250 / (b / cnt));
  for (let o = 0; o < d.length; o += 4) {
    let R = d[o] * kr, G = d[o + 1] * kg, B = d[o + 2] * kb;
    const L = (R + G + B) / 3;
    R = L + (R - L) * 1.3; G = L + (G - L) * 1.3; B = L + (B - L) * 1.3;   // +30% насыщенности
    d[o] = R; d[o + 1] = G; d[o + 2] = B;                                     // Uint8Clamped сам обрежет 0..255
  }
  g.putImageData(img, 0, 0);
}

/* ---- Эрозия/дилатация бинарной маски (квадратное окно, два прохода) ---- */
function morph(src, w, h, r, grow) {
  const tmp = new Uint8Array(w * h), out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let m = grow ? 0 : 1;
    for (let dx = -r; dx <= r; dx++) {
      const xx = x + dx, v = xx < 0 || xx >= w ? 0 : src[y * w + xx];
      if (grow ? v : !v) { m = grow ? 1 : 0; break; }
    }
    tmp[y * w + x] = m;
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let m = grow ? 0 : 1;
    for (let dy = -r; dy <= r; dy++) {
      const yy = y + dy, v = yy < 0 || yy >= h ? 0 : tmp[yy * w + x];
      if (grow ? v : !v) { m = grow ? 1 : 0; break; }
    }
    out[y * w + x] = m;
  }
  return out;
}

/* ---- Вырезание животного из белого фона ----
   • Пиксель почти белый (min(R,G,B) > 232) → прозрачный.
   • Пиксель светло-серый (200…232) → полупрозрачный (мягкий край, без «лесенки»).
   • Цветной (насыщенный) или тёмный (контур) → остаётся.
   Если лист найден по меткам, мы ТОЧНО знаем, где силуэт, и дополнительно используем маски:
     inner — внутренность силуэта: всегда непрозрачна (нераскрашенная белая кошка остаётся белой, а не «дырявой»);
     outer — силуэт, раздутый на ~10 px: всё, что снаружи, — фон (тени, край стола, случайные каракули).
   Между ними работает цветовой порог — он прощает небольшой сдвиг листа. */
function cutout(c, masks) {
  const g = ctx2d(c), img = g.getImageData(0, 0, c.width, c.height), d = img.data;
  for (let i = 0, o = 0; o < d.length; i++, o += 4) {
    let a;
    if (masks && masks.inner[i]) a = 255;
    else if (masks && !masks.outer[i]) a = 0;
    else {
      const R = d[o], G = d[o + 1], B = d[o + 2];
      const mn = Math.min(R, G, B), mx = Math.max(R, G, B);
      if (mx - mn > 45) a = 255;                          // явно цветной — это раскраска
      else if (mn >= 232) a = 0;                           // белая бумага
      else if (mn <= 200) a = 255;                         // серый/чёрный — контур или штриховка
      else a = Math.round((232 - mn) / 32 * 255);          // мягкий переход
    }
    d[o + 3] = a;
  }
  g.putImageData(img, 0, 0);
}

/* ---- Уборка мусора (только для запасного режима без меток) ----
   Без меток мы не знаем точно, где силуэт, и в кадр могут попасть край стола,
   обрывки квадратов, буквы подписи. Оставляем самое большое непрозрачное пятно (это зверёк)
   и крупные куски, не касающиеся края картинки; всё остальное делаем прозрачным. */
function keepMainBlob(c) {
  const W = c.width, H = c.height, g = ctx2d(c), img = g.getImageData(0, 0, W, H), d = img.data;
  const lab = new Int32Array(W * H), queue = new Int32Array(W * H), comps = [0];
  for (let s = 0; s < W * H; s++) {
    if (lab[s] || d[s * 4 + 3] < 60) continue;
    const id = comps.length;
    let qh = 0, qt = 0, area = 0, border = false;
    queue[qt++] = s; lab[s] = id;
    while (qh < qt) {
      const p = queue[qh++], x = p % W, y = (p / W) | 0;
      area++;
      if (x === 0 || y === 0 || x === W - 1 || y === H - 1) border = true;
      for (const q of [x > 0 ? p - 1 : -1, x < W - 1 ? p + 1 : -1, y > 0 ? p - W : -1, y < H - 1 ? p + W : -1]) {
        if (q >= 0 && !lab[q] && d[q * 4 + 3] >= 60) { lab[q] = id; queue[qt++] = q; }
      }
    }
    comps.push({ area, border });
  }
  // главное пятно — самое большое из НЕ касающихся края (край стола обычно касается края кадра)
  let best = 0;
  for (let i = 1; i < comps.length; i++) if (!comps[i].border && (!best || comps[i].area > comps[best].area)) best = i;
  if (!best) for (let i = 1; i < comps.length; i++) if (!best || comps[i].area > comps[best].area) best = i;
  if (!best) return;
  const keep = comps.map((q, i) => i === best || (i > 0 && !q.border && q.area > comps[best].area * 0.15));
  for (let p = 0; p < W * H; p++) if (!keep[lab[p]]) d[p * 4 + 3] = 0;
  g.putImageData(img, 0, 0);
}


/* ---- Какое животное на листе? ----
   Сравниваем тёмные пиксели фото с линиями всех шаблонов. Если ребёнок показал мышку,
   а сверху выбрана «Кошка», программа сама поправит выбор. */
function guessAnimal(tex, current) {
  const d = ctx2d(tex).getImageData(0, 0, TEX.w, TEX.h).data;
  const score = key => {
    const m = ANIMALS[key].dark;
    let on = 0, onDark = 0, off = 0, offDark = 0;
    for (let i = 0; i < m.length; i += 3) {
      const o = i * 4, dark = (d[o] + d[o + 1] + d[o + 2]) < 300;
      if (m[i]) { on++; if (dark) onDark++; } else { off++; if (dark) offDark++; }
    }
    return onDark / on - offDark / off;
  };
  const scores = ANIMAL_KEYS.map(k => [k, score(k)]).sort((a, b) => b[1] - a[1]);
  const [best, second] = scores;
  if (best[1] < 0.12 || best[1] - second[1] < 0.04) return current;   // не уверены — оставляем выбор
  return best[0];
}

/* ---- Спрайты: «вырезание по маске» и обрезка по содержимому ---- */
function maskedCopy(tex, mask, mode = 'destination-in') {
  const c = makeCanvas(TEX.w, TEX.h), g = c.getContext('2d');
  g.drawImage(tex, 0, 0);
  g.globalCompositeOperation = mode;
  g.drawImage(mask, 0, 0);
  return c;
}
// Спрайты храним уменьшенными (×0,6): на экране зверёк всё равно меньше текстуры,
// а 35 зверят × 6 частей в полном размере заняли бы слишком много памяти.
const SPR = 0.6;
function cropSprite(c) {
  const d = ctx2d(c).getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    if (d[(y * c.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return null;
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  const out = makeCanvas(Math.max(1, Math.round(w * SPR)), Math.max(1, Math.round(h * SPR)));
  const g = out.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(c, x0, y0, w, h, 0, 0, out.width, out.height);
  return { img: out, x: x0, y: y0, w, h };                     // x, y, w, h — в координатах текстуры
}

// Средний цвет туловища — им красим хвостик/лапки в запасном режиме и сердечки
function averageColor(tex, a) {
  const body = morph(a.sil.map((v, i) => v & !a.limbs[i]), TEX.w, TEX.h, 6, false);
  const d = ctx2d(tex).getImageData(0, 0, TEX.w, TEX.h).data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < body.length; i += 2) {
    if (!body[i]) continue;
    const o = i * 4;
    if (d[o + 3] < 128 || d[o] + d[o + 1] + d[o + 2] < 180) continue;   // пропускаем прозрачное и чёрные линии
    r += d[o]; g += d[o + 1]; b += d[o + 2]; n++;
  }
  if (!n) return 'rgb(245,180,130)';
  return `rgb(${r / n | 0},${g / n | 0},${b / n | 0})`;
}

/* ---- Сборка «живого» зверька из текстуры ----
   precise=true: лист найден по меткам (или рисовали на экране) → разрезаем НАСТОЯЩИЙ
   рисунок ребёнка на туловище и подвижные части: двигаются именно раскрашенные лапки.
   precise=false (метки не нашлись): резать рискованно, поэтому анимируем цельную картинку,
   а поверх рисуем мультяшные хвостик и лапки среднего цвета рисунка. */
function buildCreature(tex, key, precise) {
  const a = ANIMALS[key];
  const cr = { key, a, precise, color: averageColor(tex, a) };
  if (precise) {
    cr.parts = a.parts.map(P => ({ P, sprite: cropSprite(maskedCopy(tex, maskCanvas(P.mask))), pivot: P.pivotT }));
    cr.body = cropSprite(maskedCopy(tex, maskCanvas(a.limbs), 'destination-out'));
  } else {
    cr.parts = [];
    cr.body = cropSprite(tex);
  }
  if (!cr.body) cr.body = { img: tex, x: 0, y: 0, w: TEX.w, h: TEX.h };
  return cr;
}

// Маски для вырезания: внутри силуэта всегда непрозрачно, снаружи раздутого силуэта — фон
function silMasks(key) {
  const sil = ANIMALS[key].sil;
  return { inner: morph(sil, TEX.w, TEX.h, 5, false), outer: morph(sil, TEX.w, TEX.h, 8, true) };
}

/* ---- Конвейер делится на две половины ----
   1) photoToItem: фото → выпрямленная «сырая» текстура 720×720 (ещё с белым фоном) + какое животное.
      Такую текстуру легко отправить с телефона на поляну: это обычная картинка JPEG.
   2) finishCreature: сырая текстура → вырезание фона → живой зверёк. Делает тот экран,
      где зверёк будет гулять (компьютер с поляной или сам телефон). */
function photoToItem(src, R, key) {
  const pts = findMarkers(src, R);
  const precise = !!pts;
  const H = precise
    ? homography(MARK_CENTERS, pts)
    : homography([[0, 0], [SHEET.w, 0], [0, SHEET.h], [SHEET.w, SHEET.h]],
                 [[R.x, R.y], [R.x + R.w, R.y], [R.x, R.y + R.h], [R.x + R.w, R.y + R.h]]);
  const raw = rectify(src, H);
  key = guessAnimal(raw, key);
  whiteBalance(raw, precise ? silMasks(key).outer.map(v => 1 - v) : null);   // бумага = всё вне силуэта
  return { raw, key, precise };
}
function drawingToItem(raw, key) { return { raw, key, precise: true }; }

function finishCreature(item) {
  const tex = makeCanvas(TEX.w, TEX.h);
  ctx2d(tex).drawImage(item.raw, 0, 0, TEX.w, TEX.h);
  cutout(tex, item.precise ? silMasks(item.key) : null);
  if (!item.precise) keepMainBlob(tex);
  return buildCreature(tex, item.key, item.precise);
}

// Большие фото с телефона уменьшаем до 1600 px — точности хватает, а работает в разы быстрее
function toWorkCanvas(source, sw, sh) {
  const k = Math.min(1, 1600 / Math.max(sw, sh));
  const c = makeCanvas(Math.round(sw * k), Math.round(sh * k));
  ctx2d(c).drawImage(source, 0, 0, c.width, c.height);
  return { canvas: c, k };
}

/* =====================================================================
   ШАГ 3. ПОЛЯНА И АНИМАЦИЯ
   ---------------------------------------------------------------------
   Поляна с глубиной: у каждого зверька есть координата z (0 — далеко у холмов,
   1 — у самого края экрана). Чем дальше зверёк, тем он выше на экране и меньше.
   Каждый кадр зверьки сортируются по z, поэтому дальние проходят ЗА ближними.
   Статичный фон рисуется один раз в отдельный canvas, в кадре — только движение.
   ===================================================================== */
const SPECIES_SIZE = { cat: 1, dog: 1, mouse: 0.72, hamster: 0.72 };   // мышка и хомячок поменьше

const Stage = {
  canvas: null, g: null, w: 0, h: 0, dpr: 1,
  bg: null, clouds: [], blades: [], hearts: [], sparkles: [],
  herd: [], running: false, last: 0, t: 0, lastVoice: -10,

  init() {
    this.canvas = document.getElementById('stageCanvas');
    this.g = this.canvas.getContext('2d');
    window.addEventListener('resize', () => { if (this.running) this.resize(); });
    this.canvas.addEventListener('pointerdown', e => this.tap(e));
  },

  /* ---- Геометрия глубины ---- */
  horizon() { return this.h * 0.40; },
  yOf(z) { return this.h * (0.50 + 0.46 * z); },                // линия лап на экране
  zOf(y) { return Math.max(0, Math.min(1, (y / this.h - 0.50) / 0.46)); },
  sizeOf(z) { return 0.42 + 0.58 * z; },                          // дальние в 2,4 раза меньше ближних
  scaleOf(cr, z) {                                                // пикселей экрана на пиксель текстуры
    const n = this.herd.length;
    const crowd = n <= 10 ? 1 : Math.max(0.6, 1 - (n - 10) * 0.016);   // в толпе все чуть мельче
    const near = Math.min(this.h * 0.36, this.w * 0.40) * crowd;       // высота самого ближнего зверька
    return near / cr.a.anchor.h * this.sizeOf(z) * (SPECIES_SIZE[cr.key] || 1);
  },

  /* ---- Зверята на поляне ---- */
  has(id) { return this.herd.some(c => c.id === id); },
  add(cr, opts = {}) {
    while (this.herd.length >= MAX_HERD) this.herd.shift();       // самый старый уходит домой
    const w = this.w || window.innerWidth;
    Object.assign(cr, {
      x: opts.quiet ? w * (0.08 + Math.random() * 0.84) : w * (0.3 + Math.random() * 0.4),
      z: opts.quiet ? Math.random() : 0.65 + Math.random() * 0.3,
      dir: Math.random() < 0.5 ? 1 : -1, state: 'idle', wait: 1 + Math.random() * 2, phase: 0, turnT: 0,
      jumpT: -1, excite: opts.quiet ? 0 : 2, sit: 0, appear: opts.quiet ? 1 : 0, seed: Math.random() * 10,
      hopT: 0, twitchT: -1, twitchIn: 2 + Math.random() * 4,
      pitch: cr.pitch || 0.9 + Math.random() * 0.25,             // у каждого свой голосок
      voiceIn: 8 + Math.random() * 20,
    });
    cr.flip = cr.dir;
    this.herd.push(cr);
    if (!opts.quiet) {
      for (let i = 0; i < 18; i++) this.sparkles.push({ x: cr.x, y: this.yOf(cr.z) - 60, vx: (Math.random() - 0.5) * 320, vy: -Math.random() * 300 - 60, t: 0, c: ['#ffd84d', '#ff9ec7', '#8fd3ff', '#fff'][i % 4] });
      document.getElementById('stageHint').style.opacity = 1;
      setTimeout(() => this.voice(cr), 450);                      // «Привет!» при появлении
    }
  },
  remove(id) { this.herd = this.herd.filter(c => c.id !== id); },
  clear() { this.herd = []; this.hearts = []; this.sparkles = []; },

  open() {
    if (this.running) return;
    this.running = true;
    this.resize();
    this.last = performance.now();
    requestAnimationFrame(ts => this.loop(ts));
  },
  stop() { this.running = false; },

  voice(cr) { Sound.voice(cr.a.voice, cr.pitch); this.lastVoice = this.t; },

  resize() {
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    const cw = this.canvas.clientWidth, ch = this.canvas.clientHeight;
    if (!cw || !ch) return;                   // экран скрыт — размеры пока неизвестны
    const oldW = this.w;
    this.w = cw; this.h = ch;
    this.canvas.width = Math.round(this.w * this.dpr); this.canvas.height = Math.round(this.h * this.dpr);
    if (oldW) for (const cr of this.herd) { cr.x *= this.w / oldW; cr.tx = undefined; }
    this.buildBackground();
    const rnd = (a, b) => a + Math.random() * (b - a);
    this.clouds = Array.from({ length: 5 }, () => ({ x: rnd(0, this.w), y: rnd(0.06, 0.26) * this.h, s: rnd(0.6, 1.2) * Math.min(this.w, this.h) / 9, v: rnd(8, 22) }));
    this.blades = Array.from({ length: Math.round(this.w / 8) }, () => ({ x: rnd(0, this.w), y: rnd(this.h * 0.95, this.h + 6), l: rnd(16, 34), ph: rnd(0, 6) }));
  },

  /* ---- Статичный фон: небо, дальние холмы и кусты, поляна с цветами ---- */
  buildBackground() {
    const { w, h, dpr } = this, hz = this.horizon();
    const c = makeCanvas(this.canvas.width, this.canvas.height), g = c.getContext('2d');
    g.scale(dpr, dpr);
    const rnd = (a, b) => a + Math.random() * (b - a);
    let gr = g.createLinearGradient(0, 0, 0, hz);
    gr.addColorStop(0, '#8fd3ff'); gr.addColorStop(1, '#e6f7ff');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const hill = (base, amp, len, color, shift) => {
      g.fillStyle = color; g.beginPath(); g.moveTo(0, h);
      for (let x = 0; x <= w + 10; x += 10) g.lineTo(x, base + Math.sin(x / len + shift) * amp + Math.sin(x / len / 2.7 + shift * 2) * amp * 0.6);
      g.lineTo(w, h); g.fill();
    };
    hill(hz - h * 0.05, h * 0.035, w / 6, '#c9eeb4', 1);          // самые дальние — светлые, «в дымке»
    hill(hz - h * 0.015, h * 0.025, w / 4, '#b3e39a', 3);
    // кустики и деревца вдоль горизонта
    for (let x = rnd(0, 60); x < w; x += rnd(60, 140)) {
      const y = hz + rnd(-4, 6), r = rnd(10, 20);
      if (Math.random() < 0.35) {                                  // деревце
        g.fillStyle = '#9b7653'; g.fillRect(x - 3, y - r * 1.6, 6, r * 1.6);
        g.fillStyle = '#7cc46a'; g.beginPath(); g.arc(x, y - r * 2, r * 1.2, 0, 7); g.arc(x - r * 0.8, y - r * 1.5, r * 0.9, 0, 7); g.arc(x + r * 0.8, y - r * 1.5, r * 0.9, 0, 7); g.fill();
      } else {                                                     // кустик
        g.fillStyle = '#8fd07a'; g.beginPath(); g.arc(x, y - r * 0.4, r, Math.PI, 0); g.arc(x + r, y - r * 0.2, r * 0.7, Math.PI, 0); g.fill();
      }
    }
    // поляна: светлее вдали, темнее вблизи — так глаз «видит» глубину
    gr = g.createLinearGradient(0, hz, 0, h);
    gr.addColorStop(0, '#b6e69c'); gr.addColorStop(0.45, '#93d77c'); gr.addColorStop(1, '#6cbf55');
    g.fillStyle = gr; g.fillRect(0, hz, w, h - hz);
    hill(hz, h * 0.006, w / 9, '#b6e69c', 0);
    // кочки травы и цветы: чем ближе, тем крупнее
    for (let i = 0; i < w * h / 2500; i++) {
      const y = rnd(hz + 6, h), k = 0.35 + 0.65 * (y - hz) / (h - hz), x = rnd(0, w);
      g.strokeStyle = `rgba(60,140,50,${0.25 + 0.35 * k})`; g.lineWidth = 1.5 * k + 0.5;
      g.beginPath();
      for (let j = -1; j <= 1; j++) { g.moveTo(x + j * 4 * k, y); g.quadraticCurveTo(x + j * 5 * k, y - 6 * k, x + j * 9 * k, y - 12 * k); }
      g.stroke();
    }
    const colors = ['#fff', '#ffe066', '#ff9ec7', '#c9a7ff', '#ff8a65'];
    for (let i = 0; i < Math.round(w / 22); i++) {
      const y = rnd(hz + 10, h), k = 0.3 + 0.7 * (y - hz) / (h - hz), x = rnd(0, w), r = (3 + Math.random() * 3) * k + 1;
      g.strokeStyle = '#4a9a3a'; g.lineWidth = Math.max(1, 2 * k); g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + r * 2.5); g.stroke();
      g.fillStyle = colors[i % colors.length];
      for (let p = 0; p < 5; p++) { g.beginPath(); g.arc(x + Math.cos(p * 1.256) * r, y + Math.sin(p * 1.256) * r, r * 0.75, 0, 7); g.fill(); }
      g.fillStyle = '#ffc93c'; g.beginPath(); g.arc(x, y, r * 0.6, 0, 7); g.fill();
    }
    this.bg = c;
  },

  // Солнышко: круг и «дышащие» лучики, без лица
  drawSun(g, t) {
    const r = Math.min(this.w, this.h) * 0.07, x = this.w - r * 2.2, y = r * 2.2 + 64;
    g.save(); g.translate(x, y); g.rotate(t * 0.25);
    g.strokeStyle = '#ffd84d'; g.lineWidth = r * 0.18; g.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      g.rotate(Math.PI / 6);
      g.beginPath(); g.moveTo(r * 1.25, 0); g.lineTo(r * (1.55 + Math.sin(t * 3 + i) * 0.1), 0); g.stroke();
    }
    g.restore();
    const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    gr.addColorStop(0, '#fff3a6'); gr.addColorStop(1, '#ffd84d');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  },

  drawCloud(g, c) {
    g.fillStyle = '#ffffffee';
    g.beginPath();
    g.arc(c.x, c.y, c.s * 0.5, 0, 7);
    g.arc(c.x + c.s * 0.5, c.y - c.s * 0.25, c.s * 0.55, 0, 7);
    g.arc(c.x + c.s, c.y, c.s * 0.45, 0, 7);
    g.fill();
    g.fillRect(c.x, c.y - c.s * 0.1, c.s, c.s * 0.45);
  },

  /* ---- Главный цикл ---- */
  loop(ts) {
    if (!this.running) return;
    const dt = Math.min(0.05, (ts - this.last) / 1000);      // защита от «скачка», если вкладка спала
    this.last = ts; this.t += dt;
    requestAnimationFrame(t2 => this.loop(t2));
    // окно могли свернуть/развернуть: подстраиваемся, а пока холст нулевой — просто ждём
    const cw = this.canvas.clientWidth, ch = this.canvas.clientHeight;
    if (!cw || !ch) return;
    if (cw !== this.w || ch !== this.h || !this.bg) this.resize();
    this.update(dt);
    this.draw();
  },

  // Куда пойти: случайная точка поляны, не слишком близко к текущей
  pickTarget(cr) {
    const far = cr.a.gait === 'hop' ? 0.08 : 0.15;                 // грызуны скачут недалеко
    for (let k = 0; k < 6; k++) {
      const tx = this.w * (0.08 + Math.random() * 0.84), tz = Math.random();
      if (cr.a.gait === 'hop' && (Math.abs(tx - cr.x) > this.w * 0.3 || Math.abs(tz - cr.z) > 0.35)) continue;
      if (Math.abs(tx - cr.x) > this.w * far || Math.abs(tz - cr.z) > 0.2) { cr.tx = tx; cr.tz = tz; return; }
    }
    cr.tx = Math.max(this.w * 0.08, Math.min(this.w * 0.92, cr.x + (Math.random() - 0.5) * this.w * 0.3));
    cr.tz = Math.max(0, Math.min(1, cr.z + (Math.random() - 0.5) * 0.3));
  },

  // Дошёл до цели: кошка/собака иногда садятся, мышка/хомячок сидят столбиком и умываются
  arrive(cr) {
    const hopper = cr.a.gait === 'hop';
    if (Math.random() < (hopper ? 0.7 : 0.45)) { cr.state = 'sit'; cr.wait = (hopper ? 4 : 5) + Math.random() * 6; }
    else { cr.state = 'idle'; cr.wait = 1 + Math.random() * 2.5; }
  },

  update(dt) {
    for (const c of this.clouds) { c.x += c.v * dt; if (c.x > this.w + c.s * 1.5) c.x = -c.s * 1.6; }
    const depthPx = this.h * 0.46;
    for (const cr of this.herd) {
      cr.appear = Math.min(1, cr.appear + dt * 2.2);
      cr.excite = Math.max(0, cr.excite - dt);
      if (cr.jumpT >= 0) { cr.jumpT += dt; if (cr.jumpT > 0.6) cr.jumpT = -1; }
      cr.sit += ((cr.state === 'sit' && cr.a.gait === 'walk' ? 1 : 0) - cr.sit) * Math.min(1, dt * 4);
      // ушки иногда подёргиваются
      cr.twitchIn -= dt;
      if (cr.twitchIn <= 0) { cr.twitchT = 0; cr.twitchIn = 1.5 + Math.random() * 4; }
      if (cr.twitchT >= 0) { cr.twitchT += dt; if (cr.twitchT > 0.45) cr.twitchT = -1; }

      if (cr.state === 'idle' || cr.state === 'sit') {
        cr.wait -= dt;
        if (cr.wait <= 0) { cr.state = 'walk'; this.pickTarget(cr); }
      } else if (cr.state === 'turn') {
        // Разворот: зверёк «сплющивается» по X и отражается — выглядит как поворот
        cr.turnT += dt;
        const p = Math.min(1, cr.turnT / 0.4);
        cr.flip = cr.dir * Math.cos(Math.PI * p);
        if (p >= 1) { cr.dir = -cr.dir; cr.flip = cr.dir; cr.state = 'walk'; cr.excite = Math.max(cr.excite, 1.2); }
      } else if (cr.state === 'walk') {
        if (cr.tx === undefined) this.pickTarget(cr);
        const dx = cr.tx - cr.x, dz = (cr.tz - cr.z) * depthPx, dist = Math.hypot(dx, dz);
        const s = this.scaleOf(cr, cr.z);
        if (Math.abs(dx) > 8 && Math.sign(dx) !== cr.dir && (cr.a.gait === 'walk' || cr.hopT === 0)) { cr.state = 'turn'; cr.turnT = 0; }
        else if (dist < 6 && (cr.a.gait === 'walk' || cr.hopT === 0)) this.arrive(cr);
        else if (cr.a.gait === 'hop') {
          // Скачок: 0,3 с в воздухе, 0,15 с приземление; двигаемся только в воздухе
          const HOP = 0.45, AIR = 0.3;
          const tPrev = cr.hopT * HOP; let tNow = tPrev + dt;
          if (tPrev < AIR) {
            const air = Math.min(tNow, AIR) - tPrev;
            const speed = cr.a.anchor.w * 0.9 * s / AIR * 0.5;                  // полкорпуса за прыжок
            const step = Math.min(dist, speed * air);
            if (dist > 0) { cr.x += dx / dist * step; cr.z += dz / dist * step / depthPx; }
          }
          if (tNow >= HOP) tNow = 0;
          cr.hopT = tNow / HOP;
        } else {
          // Шаг без «проскальзывания»: скорость лап подобрана под скорость тела, так что стоящая
          // на земле лапа уезжает назад ровно с той скоростью, с какой зверёк идёт вперёд.
          const speed = Math.max(40, Math.min(150, this.w / 11)) * this.sizeOf(cr.z);
          const step = Math.min(dist, speed * dt);
          cr.x += dx / dist * step;
          cr.z += dz / dist * step / depthPx;
          // за опорную половину шага стопа проезжает 4·размах·длину лапы (см. pose) — столько же проходит тело
          cr.phase += step * Math.PI / (2 * LEG_SWING * cr.a.legLen * s);
        }
      }
      // иногда зверёк сам подаёт голос (но не все хором)
      cr.voiceIn -= dt;
      if (cr.voiceIn <= 0) {
        if (this.t - this.lastVoice > 3.5) { this.voice(cr); cr.voiceIn = 16 + Math.random() * 20; }
        else cr.voiceIn = 1 + Math.random() * 4;
      }
    }
    for (const hh of this.hearts) { hh.t += dt; hh.x += hh.vx * dt; hh.y -= 70 * dt; }
    this.hearts = this.hearts.filter(hh => hh.t < 1.6);
    for (const s of this.sparkles) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; }
    this.sparkles = this.sparkles.filter(s => s.t < 1.1);
  },

  draw() {
    const g = this.g, t = this.t;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(this.bg, 0, 0);
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.drawSun(g, t);
    for (const c of this.clouds) this.drawCloud(g, c);

    // сначала тени всех, потом зверьки от дальних к ближним
    const order = [...this.herd].sort((a, b) => a.z - b.z);
    for (const cr of order) {
      const s = this.scaleOf(cr, cr.z) * this.popScale(cr), up = -this.liftY(cr);
      const k = Math.max(0.5, 1 - up / (this.h * 0.3));
      g.fillStyle = 'rgba(40,90,30,.22)';
      g.beginPath(); g.ellipse(cr.x, this.yOf(cr.z) + 2, cr.a.anchor.w * 0.34 * s * k, 10 * this.sizeOf(cr.z) * k, 0, 0, 7); g.fill();
    }
    for (const cr of order) this.drawCreature(g, cr);

    for (const s of this.sparkles) {                            // звёздочки при появлении
      g.globalAlpha = Math.max(0, 1 - s.t / 1.1);
      g.fillStyle = s.c; this.star(g, s.x, s.y, 7);
    }
    g.globalAlpha = 1;

    // травинки на переднем плане колышутся на ветру
    g.strokeStyle = '#4fa63d'; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath();
    for (const b of this.blades) {
      const sway = Math.sin(t * 2 + b.ph) * 5;
      g.moveTo(b.x, b.y); g.quadraticCurveTo(b.x + sway * 0.4, b.y - b.l * 0.6, b.x + sway, b.y - b.l);
    }
    g.stroke();

    for (const hh of this.hearts) {                             // сердечки после «погладить»
      g.globalAlpha = Math.min(1, Math.max(0, 1 - hh.t / 1.6));
      g.fillStyle = hh.c;
      this.heart(g, hh.x, hh.y, hh.s);
    }
    g.globalAlpha = 1;
  },

  // Появление: «выпрыгивает» из точки с пружинкой
  popScale(cr) { const p = cr.appear; return p >= 1 ? 1 : 1 - Math.cos(p * Math.PI * 2.5) * Math.exp(-p * 4); },
  // Насколько зверёк над травой: прыжок от касания + скачки грызунов
  liftY(cr) {
    let y = 0;
    if (cr.jumpT >= 0) y -= Math.sin(Math.PI * cr.jumpT / 0.6) * this.h * 0.14 * this.sizeOf(cr.z);
    if (cr.a.gait === 'hop' && cr.state === 'walk' && cr.hopT > 0 && cr.hopT < 0.3 / 0.45)
      y -= Math.sin(Math.PI * cr.hopT * 0.45 / 0.3) * cr.a.anchor.h * 0.14 * this.scaleOf(cr, cr.z);
    return y;
  },

  drawCreature(g, cr) {
    const a = cr.a, s = this.scaleOf(cr, cr.z) * this.popScale(cr);
    const walking = cr.state === 'walk' && a.gait === 'walk' ? 1 : 0;
    const bob = Math.sin(cr.phase * 2) * 4 * walking * this.sizeOf(cr.z);    // покачивание 3–5 px
    let sx = 1, sy = 1;
    if (cr.jumpT >= 0) { const p = cr.jumpT / 0.6; sy = 1 + Math.sin(Math.PI * 2 * p) * 0.06; sx = 1 / sy; }
    if (a.gait === 'hop' && cr.state === 'walk') {                            // скачок: сжаться → вытянуться → сжаться
      const p = cr.hopT;
      sy = p < 0.67 ? 1 + Math.sin(Math.PI * p / 0.67) * 0.07 : 1 - Math.sin(Math.PI * (p - 0.67) / 0.33) * 0.08;
      sx = 1 / sy;
    }
    const breath = 1 + Math.sin(this.t * 2.2 + cr.seed) * 0.012;            // дыхание, даже когда стоит
    g.save();
    g.translate(cr.x, this.yOf(cr.z) + bob + this.liftY(cr));
    g.scale(cr.flip * s * sx, s * sy * breath * (1 - 0.07 * cr.sit));      // кошка/собака сидя чуть приседают
    g.translate(-a.anchor.x, -a.anchor.y);
    if (cr.precise) this.drawPrecise(g, cr, walking);
    else this.drawSimple(g, cr, walking);
    g.restore();
  },

  // Угол и подъём каждой подвижной части в этот момент
  pose(cr, P, walking) {
    const t = this.t, fast = cr.excite > 0 || cr.state === 'sit';
    if (P.kind === 'tail') {
      const long = cr.key === 'mouse';                                        // длинный мышиный хвост — плавнее
      const f = long ? (fast ? 1.6 : 0.8) : (fast ? 3.4 : 1.4), amp = long ? 0.12 : (fast ? 0.32 : 0.22);
      return [Math.sin(t * Math.PI * 2 * f + cr.seed) * amp, 0];
    }
    if (P.kind === 'leg') {
      // Цикл шага (u от 0 до 1): первая половина — перенос: лапа поднята и летит ВПЕРЁД по ходу движения;
      // вторая — опора: лапа стоит на траве и равномерно уезжает назад ровно со скоростью тела,
      // поэтому не скользит. (В прошлой версии знак был перепутан — зверьки шагали будто задом наперёд.)
      const u = ((cr.phase / (2 * Math.PI) + (P.pair ? 0.5 : 0)) % 1 + 1) % 1;
      let x, lift = 0;
      if (u < 0.5) { x = -Math.cos(2 * Math.PI * u); lift = Math.sin(2 * Math.PI * u) * 18; }
      else x = 1 - 4 * (u - 0.5);
      return [-x * LEG_SWING * walking, lift * walking];     // x > 0 — стопа впереди оси
    }
    if (P.kind === 'ear') {
      let ang = 0;
      if (cr.twitchT >= 0) ang += Math.sin(cr.twitchT / 0.45 * Math.PI * 3) * 0.16;      // подёргивание
      if (cr.a.gait === 'hop' && cr.state === 'walk') ang += Math.sin(Math.PI * cr.hopT) * 0.18;   // уши «подлетают» в прыжке
      return [ang * P.side, 0];
    }
    if (P.kind === 'paw') {
      if (cr.a.gait === 'hop' && cr.state === 'walk') return [0, 6];         // в прыжке лапки поджаты
      // сидя «умываются» и перебирают лапками — сериями, с паузами
      const burst = Math.max(0, Math.sin(t * 0.9 + cr.seed)) * (cr.excite > 0 ? 1.5 : 1);
      const ph = t * 7 + (P.pair ? Math.PI : 0);
      return [Math.sin(ph) * 0.16 * burst * (P.pair ? -1 : 1), (Math.sin(ph) * 0.5 + 0.5) * 14 * burst];
    }
    return [0, 0];
  },

  /* Точный режим: двигаем настоящие вырезанные части ребёнкиного рисунка */
  drawPrecise(g, cr, walking) {
    const drawPart = part => {
      if (!part.sprite) return;
      const [ang, lift] = this.pose(cr, part.P, walking);
      const [px, py] = part.pivot, sp = part.sprite;
      g.save();
      g.translate(px, py - lift); g.rotate(ang); g.translate(-px, -py);
      g.drawImage(sp.img, sp.x, sp.y, sp.w, sp.h);
      g.restore();
    };
    for (const part of cr.parts) if (part.P.layer === 'back') drawPart(part);   // дальние части — за туловищем
    g.drawImage(cr.body.img, cr.body.x, cr.body.y, cr.body.w, cr.body.h);
    for (const part of cr.parts) if (part.P.layer === 'front') drawPart(part);  // ближние — поверх
  },

  /* Запасной режим: цельная картинка + мультяшные хвостик и лапки цвета рисунка */
  drawSimple(g, cr, walking) {
    const a = cr.a;
    const tail = a.parts.find(P => P.kind === 'tail');
    if (tail) {
      const [tx, ty] = tail.pivotT, [ang] = this.pose(cr, tail, walking);
      g.save();                                                // пушистый хвостик позади
      g.translate(tx, ty); g.rotate(-2.2 + ang);
      g.fillStyle = cr.color; g.strokeStyle = '#222'; g.lineWidth = 7;
      g.beginPath(); g.ellipse(70, 0, 80, 26, 0, 0, 7); g.fill(); g.stroke();
      g.beginPath(); g.ellipse(145, 0, 26, 22, 0, 0, 7); g.fill(); g.stroke();
      g.restore();
    }
    g.drawImage(cr.body.img, cr.body.x, cr.body.y, cr.body.w, cr.body.h);
    for (const L of a.parts) {                                // лапки поочерёдно поднимаются
      if (L.kind !== 'leg') continue;
      const [, lift] = this.pose(cr, L, walking);
      const [fx, fy] = L.foot;
      g.fillStyle = cr.color; g.strokeStyle = '#222'; g.lineWidth = 6;
      g.beginPath(); g.ellipse(fx, fy - 18 - lift * 1.4, 38, 20, 0, 0, 7); g.fill(); g.stroke();
      g.beginPath();
      g.moveTo(fx - 11, fy - 28 - lift * 1.4); g.lineTo(fx - 11, fy - 14 - lift * 1.4);
      g.moveTo(fx + 11, fy - 28 - lift * 1.4); g.lineTo(fx + 11, fy - 14 - lift * 1.4);
      g.stroke();
    }
  },

  heart(g, x, y, s) {
    g.beginPath();
    g.moveTo(x, y + s * 0.35);
    g.bezierCurveTo(x - s, y - s * 0.3, x - s * 0.45, y - s, x, y - s * 0.45);
    g.bezierCurveTo(x + s * 0.45, y - s, x + s, y - s * 0.3, x, y + s * 0.35);
    g.fill();
    g.strokeStyle = '#0003'; g.lineWidth = 2; g.stroke();
  },
  star(g, x, y, r) {
    g.beginPath();
    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    g.fill();
  },

  /* ---- Касание: по зверьку — прыжок и голос; по траве — все бегут к пальцу ---- */
  tap(e) {
    Sound.unlock();
    const r = this.canvas.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    document.getElementById('stageHint').style.opacity = 0;
    // проверяем от ближних к дальним: ближний зверёк закрывает дальнего
    const order = [...this.herd].sort((a, b) => b.z - a.z);
    for (const cr of order) {
      const s = this.scaleOf(cr, cr.z), f = Math.abs(cr.flip) > 0.2 ? cr.flip : 1;
      const tx = (px - cr.x) / (f * s) + cr.a.anchor.x;
      const ty = (py - this.yOf(cr.z) - this.liftY(cr)) / s + cr.a.anchor.y;
      const b = cr.body, pad = 30;
      if (tx > b.x - pad && tx < b.x + b.w + pad && ty > b.y - pad && ty < cr.a.anchor.y + pad) {
        cr.jumpT = 0; cr.excite = 2.5;
        if (cr.state === 'sit') { cr.state = 'idle'; cr.wait = 0.8; }
        this.voice(cr);
        for (let i = 0; i < 6; i++) this.hearts.push({
          x: px + (Math.random() - 0.5) * 60, y: py - 20, vx: (Math.random() - 0.5) * 60,
          s: 14 + Math.random() * 12, t: -i * 0.08, c: i % 2 ? '#ff6f9f' : cr.color,
        });
        return;
      }
    }
    // по траве: зовём всех к себе
    Sound.pip();
    const tz = this.zOf(py);
    for (const cr of this.herd) {
      cr.tx = Math.max(20, Math.min(this.w - 20, px + (Math.random() - 0.5) * this.w * 0.25));
      cr.tz = Math.max(0, Math.min(1, tz + (Math.random() - 0.5) * 0.25));
      cr.excite = 1.5;
      if (cr.state !== 'turn') cr.state = 'walk';
    }
  },
};
const LEG_SWING = 0.2;        // размах шага (радианы)
